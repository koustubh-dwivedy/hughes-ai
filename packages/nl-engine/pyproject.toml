[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nl_engine"]
