examples:
  - question: "What was our approval rate last quarter?"
    sql: |
      SELECT
        ROUND(
          COUNT(CASE WHEN has_symitar_link THEN 1 END)::NUMERIC
          / NULLIF(COUNT(CASE WHEN has_los_link THEN 1 END), 0) * 100,
          2
        ) AS approval_rate_pct
      FROM recon_bridge
      WHERE created_at >= DATE_TRUNC('quarter', CURRENT_DATE - INTERVAL '3 months')
        AND created_at <  DATE_TRUNC('quarter', CURRENT_DATE)
    notes: >
      Use recon_bridge for approval rate. has_los_link = application received;
      has_symitar_link = loan booked in core. Ratio gives funded/applied rate.

  - question: "How many loans did we originate last month?"
    sql: |
      SELECT COUNT(*) AS origination_count
      FROM fct_loan_originations
      WHERE funded_at >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 month')
        AND funded_at <  DATE_TRUNC('month', CURRENT_DATE)
    notes: Use funded_at not applied_at for origination date.

  - question: "What is the average loan amount this year?"
    sql: |
      SELECT ROUND(AVG(funded_amount), 2) AS avg_loan_amount
      FROM fct_loan_originations
      WHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)
        AND funded_at <  CURRENT_DATE + INTERVAL '1 day'
    notes: Uses funded_amount (actual disbursement), not requested_amount.

  - question: "What is our current delinquency rate?"
    sql: |
      SELECT
        ROUND(
          SUM(CASE WHEN is_delinquent THEN 1 ELSE 0 END)::NUMERIC
          / NULLIF(COUNT(*), 0) * 100,
          2
        ) AS delinquency_rate_pct
      FROM fct_loan_performance
      WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM fct_loan_performance)
        AND loan_status IN ('current', 'delinquent')
    notes: Always filter to a single snapshot_date to avoid overcounting.

  - question: "What is our total portfolio balance as of the latest snapshot?"
    sql: |
      SELECT
        TO_CHAR(snapshot_date, 'YYYY-MM-DD') AS as_of_date,
        ROUND(SUM(balance), 2)               AS total_portfolio_balance
      FROM fct_loan_performance
      WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM fct_loan_performance)
        AND loan_status IN ('current', 'delinquent')
      GROUP BY snapshot_date
    notes: Exclude paid_off and charged_off loans from active portfolio balance.

  - question: "Show origination volume by channel this year"
    sql: |
      SELECT
        channel,
        COUNT(*)                  AS origination_count,
        ROUND(SUM(funded_amount), 2) AS total_funded_amount
      FROM fct_loan_originations
      WHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)
      GROUP BY channel
      ORDER BY origination_count DESC
    notes: channel comes from the Origence LOS application record.

  - question: "What is origination volume by product type last quarter?"
    sql: |
      SELECT
        product_type,
        COUNT(*)                     AS loan_count,
        ROUND(AVG(funded_amount), 2) AS avg_amount,
        ROUND(SUM(funded_amount), 2) AS total_funded
      FROM fct_loan_originations
      WHERE funded_at >= DATE_TRUNC('quarter', CURRENT_DATE - INTERVAL '3 months')
        AND funded_at <  DATE_TRUNC('quarter', CURRENT_DATE)
      GROUP BY product_type
      ORDER BY loan_count DESC
    notes: ""

  - question: "Which branches had the highest origination volume this year?"
    sql: |
      SELECT
        branch_name,
        branch_region,
        COUNT(*)                     AS loan_count,
        ROUND(SUM(funded_amount), 2) AS total_funded
      FROM fct_loan_originations
      WHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)
      GROUP BY branch_name, branch_region
      ORDER BY loan_count DESC
      LIMIT 5
    notes: branch_name from Symitar; branch_region groups branches geographically.

  - question: "How many loans are 30+ days past due right now?"
    sql: |
      SELECT
        COUNT(*)              AS delinquent_loans,
        ROUND(SUM(balance), 2) AS delinquent_balance
      FROM fct_loan_performance
      WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM fct_loan_performance)
        AND days_past_due >= 30
    notes: >
      Use days_past_due >= 30 explicitly rather than is_delinquent = true for
      transparency. Both produce the same result.

  - question: "Show the delinquency rate trend over the last 6 months"
    sql: |
      SELECT
        snapshot_date,
        ROUND(
          SUM(CASE WHEN is_delinquent THEN 1 ELSE 0 END)::NUMERIC
          / NULLIF(COUNT(*), 0) * 100,
          2
        ) AS delinquency_rate_pct
      FROM fct_loan_performance
      WHERE snapshot_date >= CURRENT_DATE - INTERVAL '6 months'
        AND loan_status IN ('current', 'delinquent')
      GROUP BY snapshot_date
      ORDER BY snapshot_date
    notes: One row per monthly snapshot; filter active loans only.

  - question: "What is our total deposit balance this month?"
    sql: |
      SELECT
          TO_CHAR(as_of_month, 'YYYY-MM') AS as_of_month,
          ROUND(SUM(total_balance), 2)     AS total_deposits
      FROM fct_deposits_monthly
      WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_deposits_monthly)
      GROUP BY as_of_month
    notes: >
      Always filter fct_deposits_monthly to a single as_of_month.
      Omitting the filter sums all historical snapshots and overstates the figure.

  - question: "What is the deposit breakdown by product type?"
    sql: |
      SELECT
          dp.product_name,
          dp.deposit_category,
          ROUND(SUM(f.total_balance), 2) AS total_balance,
          SUM(f.account_count)           AS account_count
      FROM fct_deposits_monthly f
      JOIN dim_deposit_product dp USING (deposit_product_id)
      WHERE f.as_of_month = (SELECT MAX(as_of_month) FROM fct_deposits_monthly)
      GROUP BY dp.product_name, dp.deposit_category
      ORDER BY total_balance DESC
    notes: >
      Join to dim_deposit_product for product_name and deposit_category
      (Core vs Non-Core). Use is_core_deposit for core/non-core filtering.

  - question: "Which branch holds the most deposits?"
    sql: |
      SELECT
          b.name                         AS branch_name,
          ROUND(SUM(f.total_balance), 2) AS total_balance,
          SUM(f.account_count)           AS account_count
      FROM fct_deposits_monthly f
      JOIN branches b ON f.branch_id = b.branch_id
      WHERE f.as_of_month = (SELECT MAX(as_of_month) FROM fct_deposits_monthly)
      GROUP BY b.name
      ORDER BY total_balance DESC
    notes: >
      branches is a raw lookup table — join on branch_id. Not in schema_context
      but always present in the DB.

  - question: "Who are our top 25 depositors?"
    sql: |
      SELECT
          m.first_name || ' ' || m.last_name AS member_name,
          ROUND(SUM(da.current_balance), 2)  AS total_balance
      FROM deposit_accounts da
      JOIN members m ON da.member_id = m.member_id
      WHERE da.closed_at IS NULL
      GROUP BY m.member_id, m.first_name, m.last_name
      ORDER BY total_balance DESC
      LIMIT 25
    notes: >
      Uses live deposit_accounts.current_balance, not the monthly mart.
      Includes all open accounts per member. Default LIMIT 25 per top_n_default_25 rule.

  - question: "What is our current blended past due ratio?"
    sql: |
      WITH past_due AS (
          SELECT SUM(balance) AS past_due_bal
          FROM fct_delinquency_monthly
          WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_delinquency_monthly)
            AND bucket IN ('30-59', '60-89', '90+')
      ),
      total AS (
          SELECT SUM(total_balance) AS total_bal
          FROM fct_loans_monthly
          WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_loans_monthly)
      )
      SELECT
          ROUND(p.past_due_bal / NULLIF(t.total_bal, 0) * 100, 2) AS past_due_ratio_pct
      FROM past_due p, total t
    notes: >
      Use CTEs to align fct_delinquency_monthly and fct_loans_monthly at the same
      as_of_month. All three DPD buckets ('30-59', '60-89', '90+') are included
      in the numerator.

  - question: "Which officers have the most past-due exposure?"
    sql: |
      SELECT
          o.officer_name,
          ROUND(SUM(f.balance), 2)   AS past_due_balance,
          SUM(f.past_due_loan_count) AS past_due_loan_count
      FROM fct_delinquency_monthly f
      JOIN dim_officer o ON f.officer_id = o.officer_id
      WHERE f.as_of_month = (SELECT MAX(as_of_month) FROM fct_delinquency_monthly)
        AND f.bucket IN ('30-59', '60-89', '90+')
      GROUP BY o.officer_id, o.officer_name
      ORDER BY past_due_balance DESC
    notes: >
      Join dim_officer to get officer_name. Do not filter dim_officer.status = 'active'
      — loans stay with originating officer regardless of current employment status.

  - question: "Show the delinquency trend by aging bucket over the last 13 months"
    sql: |
      SELECT
          as_of_month                                                         AS month,
          ROUND(SUM(CASE WHEN bucket = '30-59' THEN balance ELSE 0 END), 2)  AS bucket_30_59,
          ROUND(SUM(CASE WHEN bucket = '60-89' THEN balance ELSE 0 END), 2)  AS bucket_60_89,
          ROUND(SUM(CASE WHEN bucket = '90+'   THEN balance ELSE 0 END), 2)  AS bucket_90_plus
      FROM fct_delinquency_monthly
      WHERE as_of_month >= (SELECT MAX(as_of_month) FROM fct_delinquency_monthly)
                            - INTERVAL '12 months'
      GROUP BY as_of_month
      ORDER BY as_of_month
    notes: >
      90-119 and 120+ DPD are merged into '90+' in the mart. Use CASE WHEN to
      pivot buckets into columns for trend charts.

  - question: "How many loans are currently on the watchlist?"
    sql: |
      SELECT
          COUNT(*)                              AS watchlist_count,
          COALESCE(SUM(bl.original_balance), 0) AS watchlist_balance
      FROM watchlist w
      LEFT JOIN booked_loans bl ON w.loan_id = bl.loan_id
      WHERE w.added_at::DATE <= CURRENT_DATE
        AND (w.removed_at IS NULL OR w.removed_at::DATE > CURRENT_DATE)
    notes: >
      Point-in-time filter: added_at <= today AND (removed_at IS NULL OR
      removed_at > today). Do not use removed_at IS NULL alone.

  - question: "What is the loan mix by product type this month?"
    sql: |
      SELECT
          product_type,
          SUM(loan_count)                                               AS loan_count,
          ROUND(SUM(total_balance), 2)                                  AS total_balance,
          ROUND(
              SUM(total_balance * weighted_avg_rate)
              / NULLIF(SUM(total_balance), 0),
              4
          )                                                             AS weighted_avg_rate
      FROM fct_loans_monthly
      WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_loans_monthly)
      GROUP BY product_type
      ORDER BY total_balance DESC
    notes: >
      Use fct_loans_monthly for monthly portfolio rollups. Re-weight
      weighted_avg_rate across product groups using SUM(balance*rate)/SUM(balance).

  - question: "Who are our top 25 borrowers by outstanding balance?"
    sql: |
      SELECT
          m.first_name || ' ' || m.last_name AS member_name,
          ROUND(SUM(lb.balance), 2)          AS total_balance
      FROM booked_loans bl
      JOIN loan_balances lb ON bl.loan_id = lb.loan_id
      JOIN members m        ON bl.member_id = m.member_id
      WHERE lb.snapshot_date = (SELECT MAX(snapshot_date) FROM loan_balances)
        AND bl.status NOT IN ('paid_off', 'charged_off')
      GROUP BY m.member_id, m.first_name, m.last_name
      ORDER BY total_balance DESC
      LIMIT 25
    notes: >
      Uses loan_balances for current balance; filters to active loans only.
      Default LIMIT 25 per top_n_default_25 rule.

  - question: "How many single-loan customers do we have by product type?"
    sql: |
      SELECT
          product_type,
          SUM(single_loan_customer_count) AS single_loan_customers
      FROM fct_loans_monthly
      WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_loans_monthly)
      GROUP BY product_type
      ORDER BY single_loan_customers DESC
    notes: >
      single_loan_customer_count is pre-computed in fct_loans_monthly. Sum
      across all grains to avoid double-counting members in multiple rows.

  - question: "Show new and paid-off loan events for the most recent month"
    sql: |
      SELECT
          product_type,
          event_type,
          loan_count,
          ROUND(total_amount, 2) AS total_amount
      FROM fct_loan_lifecycle_events
      WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_loan_lifecycle_events)
      ORDER BY product_type, event_type
    notes: "event_type is 'new' (newly funded) or 'paid_off'. One row per grain per month."

  - question: "Show loan-to-deposit ratio trend over the last 13 months"
    sql: |
      SELECT
          as_of_month,
          ROUND(loan_to_deposit_ratio, 4)  AS loan_to_deposit_ratio,
          ROUND(total_loans_balance, 2)    AS total_loans,
          ROUND(total_deposits_balance, 2) AS total_deposits
      FROM fct_executive_kpis
      WHERE as_of_month >= (SELECT MAX(as_of_month) FROM fct_executive_kpis)
                            - INTERVAL '12 months'
      ORDER BY as_of_month
    notes: >
      fct_executive_kpis has one row per month with pre-computed ratios.
      Regulatory target for community CUs is typically <= 0.80-0.90.

  - question: "What is our core deposit ratio trend over the past year?"
    sql: |
      SELECT
          as_of_month,
          ROUND(core_deposit_ratio * 100, 2) AS core_deposit_ratio_pct,
          ROUND(total_deposits_balance, 2)   AS total_deposits
      FROM fct_executive_kpis
      WHERE as_of_month >= (SELECT MAX(as_of_month) FROM fct_executive_kpis)
                            - INTERVAL '12 months'
      ORDER BY as_of_month
    notes: >
      core_deposit_ratio is a decimal (e.g. 0.82 = 82%). Multiply by 100 for
      percentage display.

  - question: "Show monthly loan and deposit growth for the last 12 months"
    sql: |
      SELECT
          as_of_month,
          ROUND(monthly_loan_growth, 2)    AS loan_growth,
          ROUND(monthly_deposit_growth, 2) AS deposit_growth,
          ROUND(rate_spread * 100, 4)      AS rate_spread_pct
      FROM fct_executive_kpis
      WHERE as_of_month >= (SELECT MAX(as_of_month) FROM fct_executive_kpis)
                            - INTERVAL '12 months'
      ORDER BY as_of_month
    notes: >
      monthly_loan_growth and monthly_deposit_growth are dollar changes vs prior
      month — NULL for the earliest month. rate_spread is a decimal; multiply
      by 100 for basis-point display.

  # ========================================================================
  # HUG-165: examples for new domains (households, dealers, NCUA, CECL)
  # ========================================================================

  - question: "What is our top-5 dealer concentration in indirect auto?"
    sql: |
      WITH dealer_totals AS (
          SELECT
              d.dealer_name,
              SUM(perf.balance) AS dealer_balance
          FROM fct_loan_performance perf
          INNER JOIN dim_loan loan USING (loan_id)
          INNER JOIN dim_dealer d ON loan.dealer_id = d.dealer_id
          WHERE loan.product_type = 'auto_indirect'
            AND perf.snapshot_date = (
                SELECT MAX(snapshot_date) FROM fct_loan_performance
            )
          GROUP BY d.dealer_name
      ),
      ranked AS (
          SELECT *, RANK() OVER (ORDER BY dealer_balance DESC) AS rnk
          FROM dealer_totals
      ),
      total AS (
          SELECT SUM(dealer_balance) AS portfolio_balance FROM dealer_totals
      )
      SELECT
          ROUND(SUM(CASE WHEN rnk <= 5 THEN dealer_balance ELSE 0 END)
                / total.portfolio_balance * 100, 2) AS top5_concentration_pct
      FROM ranked, total
      GROUP BY total.portfolio_balance
    notes: >
      Dealer concentration > 60% is a regulatory flag. Only auto_indirect
      loans contribute (others have NULL dealer_id).

  - question: "What is the total balance held by households over $250,000?"
    sql: |
      SELECT
          h.household_id,
          h.household_name,
          h.household_type,
          ROUND(SUM(da.current_balance)::NUMERIC, 2) AS household_balance
      FROM dim_household h
      INNER JOIN bridge_household_member hm USING (household_id)
      INNER JOIN bridge_account_owner ao
          ON ao.member_id = hm.member_id
         AND ao.owner_kind = 'deposit'
         AND ao.role = 'primary'
      INNER JOIN deposit_accounts da ON da.account_id = ao.owner_account_id
      WHERE da.closed_at IS NULL
      GROUP BY h.household_id, h.household_name, h.household_type
      HAVING SUM(da.current_balance) > 250000
      ORDER BY household_balance DESC
    notes: >
      Restrict to role='primary' to avoid double-counting joint accounts.
      Filter closed_at IS NULL to exclude closed accounts.

  - question: "Show CECL allowance balance and provision by segment for the latest month"
    sql: |
      SELECT
          seg.segment_label,
          ROUND(roll.beginning_balance::NUMERIC, 0) AS beginning_balance,
          ROUND(roll.charge_offs::NUMERIC, 0)       AS charge_offs,
          ROUND(roll.recoveries::NUMERIC, 0)        AS recoveries,
          ROUND(roll.provision_expense::NUMERIC, 0) AS provision_expense,
          ROUND(roll.ending_balance::NUMERIC, 0)    AS ending_balance
      FROM fct_cecl_allowance_rollforward roll
      INNER JOIN dim_cecl_segment seg
          ON roll.cecl_segment_code = seg.segment_code
      WHERE roll.period_end_month = (
          SELECT MAX(period_end_month) FROM fct_cecl_allowance_rollforward
      )
      ORDER BY ending_balance DESC
    notes: >
      The roll-forward closes arithmetically: ending = beginning -
      net_charge_offs + provision (zero tolerance, audited).

  - question: "What was our NCUA 5300 line 386 (Total Loans) for the most recent quarter?"
    sql: |
      SELECT
          period_end_quarter,
          ROUND(line_value::NUMERIC, 0) AS total_loans
      FROM fct_call_report
      WHERE ncua_5300_line_code = '386'
        AND period_end_quarter = (
            SELECT MAX(period_end_quarter) FROM fct_call_report
        )
    notes: >
      NCUA 5300 line 386 reconciles to SUM(dim_loan.balance) WHERE
      status != 'paid_off' within $1 (audited in tests/audit/).
