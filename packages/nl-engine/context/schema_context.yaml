tables:
  - name: fct_loan_originations
    description: >
      One row per matched funded loan linking the Origence LOS application to the
      Symitar booked loan. Use this table for origination volume, approval rate,
      funding rate, and average loan amount queries. Only contains matched loans.
    columns:
      - name: loan_id
        type: TEXT
        description: Unique loan identifier assigned by Symitar core system
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: application_id
        type: TEXT
        description: Origence LOS application identifier
        example: "8826d916-cdfb-21c6-c1ff-91a761565a70"
      - name: member_id
        type: TEXT
        description: Credit union member identifier (links applicant to member record)
        example: "m-00142"
      - name: product_type
        type: TEXT
        description: >
          Loan product code (post-HUG-160 revamp). One of: auto_direct,
          auto_indirect (dealer-channel), first_mortgage, heloc,
          closed_end_2nd, credit_card. Auto-Indirect is the only product
          with a non-NULL dealer_id.
        example: "auto_indirect"
      - name: channel
        type: TEXT
        description: Application submission channel (branch, online, mobile, dealer, broker)
        example: "online"
      - name: branch_name
        type: TEXT
        description: Name of the branch that originated the loan
        example: "Downtown Branch"
      - name: branch_region
        type: TEXT
        description: Geographic region of the originating branch (north, south, east, west, central)
        example: "north"
      - name: applied_at
        type: TIMESTAMPTZ
        description: Timestamp when the member submitted the loan application
        example: "2024-03-15T09:22:00+00:00"
      - name: funded_at
        type: TIMESTAMPTZ
        description: >
          Timestamp when the loan was funded. USE THIS as the origination date
          for volume metrics — not applied_at or originated_at.
        example: "2024-03-22T14:05:00+00:00"
      - name: originated_at
        type: TIMESTAMPTZ
        description: Timestamp when the loan was booked in Symitar (may differ slightly from funded_at)
        example: "2024-03-22T14:10:00+00:00"
      - name: requested_amount
        type: NUMERIC
        description: Dollar amount the member requested in the application
        example: "25000.00"
      - name: funded_amount
        type: NUMERIC
        description: Actual dollar amount funded (may differ from requested_amount)
        example: "22500.00"
      - name: original_balance
        type: NUMERIC
        description: Starting principal balance at loan origination (from Symitar)
        example: "22500.00"
      - name: rate
        type: NUMERIC
        description: Annual interest rate as a decimal (e.g. 0.0625 = 6.25%)
        example: "0.0625"
      - name: term_months
        type: INT
        description: Loan term in months
        example: "60"
      - name: maturity_at
        type: TIMESTAMPTZ
        description: Scheduled maturity date of the loan
        example: "2029-03-22T00:00:00+00:00"
      - name: loan_status
        type: TEXT
        description: "Current loan status: current, delinquent, charged_off, paid_off"
        example: "current"
      - name: match_type
        type: TEXT
        description: "Reconciliation match type — always 'matched' in this table"
        example: "matched"

  - name: fct_loan_performance
    description: >
      Monthly balance snapshot per loan with delinquency status. One row per
      (loan_id, snapshot_date) pair. Use this for portfolio balance trends,
      delinquency rates, and point-in-time performance analysis.
    columns:
      - name: loan_id
        type: TEXT
        description: Loan identifier — joins to fct_loan_originations and dim_loan
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: snapshot_date
        type: DATE
        description: >
          Date of the balance snapshot. Always specify this date when querying
          portfolio balance or delinquency — these are point-in-time metrics.
        example: "2024-03-31"
      - name: balance
        type: NUMERIC
        description: Outstanding principal balance on the snapshot date
        example: "21850.45"
      - name: loan_status
        type: TEXT
        description: "Loan status at snapshot date: current, delinquent, charged_off, paid_off"
        example: "current"
      - name: days_past_due
        type: INT
        description: >
          Number of days the loan payment is past due on the snapshot date.
          0 means current. Use >= 30 for delinquency threshold.
        example: "0"
      - name: delinquency_bucket
        type: TEXT
        description: "DPD bucket label: '30-59', '60-89', '90+', or null if current"
        example: "30-59"
      - name: is_delinquent
        type: BOOLEAN
        description: "True when days_past_due >= 30. Shorthand flag for 30+ DPD delinquency."
        example: "false"

  - name: dim_loan
    description: >
      Loan dimension table with product, channel, branch, and term attributes.
      Contains ALL booked loans (not just matched ones). Use for slicing metrics
      by product, channel, or branch when you need the full portfolio view.
    columns:
      - name: loan_id
        type: TEXT
        description: Unique loan identifier (primary key)
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: product_type
        type: TEXT
        description: Loan product code; one of auto_direct, auto_indirect, first_mortgage, heloc, closed_end_2nd, credit_card
        example: "first_mortgage"
      - name: channel
        type: TEXT
        description: >
          Application channel (branch, online, mobile, dealer, broker).
          'unknown' for loans without a matched LOS application.
        example: "branch"
      - name: branch_name
        type: TEXT
        description: Name of the originating branch
        example: "Westside Branch"
      - name: branch_region
        type: TEXT
        description: Geographic region of the originating branch
        example: "west"
      - name: rate_type
        type: TEXT
        description: "Interest rate type — always 'fixed' for this credit union"
        example: "fixed"
      - name: rate
        type: NUMERIC
        description: Annual interest rate as a decimal
        example: "0.0550"
      - name: term_months
        type: INT
        description: Loan term in months
        example: "48"
      - name: originated_at
        type: TIMESTAMPTZ
        description: Loan origination timestamp in Symitar
        example: "2024-01-10T11:30:00+00:00"
      - name: maturity_at
        type: TIMESTAMPTZ
        description: Scheduled maturity date
        example: "2028-01-10T00:00:00+00:00"
      - name: status
        type: TEXT
        description: "Current loan status: current, delinquent, charged_off, paid_off"
        example: "current"

  - name: recon_bridge
    description: >
      Reconciliation bridge enriched with human-readable labels. Shows how
      Origence LOS applications map (or fail to map) to Symitar booked loans.
      match_type 'matched' = direct link; 'ambiguous' = heuristic match by member;
      'unmatched' = no corresponding LOS application found.
    columns:
      - name: bridge_id
        type: INT
        description: Surrogate primary key for the reconciliation record
        example: "1"
      - name: application_id
        type: TEXT
        description: Origence LOS application_id (null for unmatched loans)
        example: "8826d916-cdfb-21c6-c1ff-91a761565a70"
      - name: loan_id
        type: TEXT
        description: Symitar booked loan_id
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: match_type
        type: TEXT
        description: "matched | ambiguous | unmatched"
        example: "matched"
      - name: match_label
        type: TEXT
        description: Human-readable match description (Direct LOS Match / Heuristic Match / No Match Found)
        example: "Direct LOS Match"
      - name: has_los_link
        type: BOOLEAN
        description: True when application_id is not null (LOS record exists)
        example: "true"
      - name: has_symitar_link
        type: BOOLEAN
        description: True when loan_id is not null (Symitar record exists)
        example: "true"
      - name: created_at
        type: TIMESTAMPTZ
        description: Timestamp when the reconciliation record was created
        example: "2024-04-01T00:00:00+00:00"

  - name: dim_member
    description: >
      Credit union member dimension. One row per member. Use for slicing
      loan or deposit metrics by member, branch, or join cohort.
    columns:
      - name: member_id
        type: TEXT
        description: Unique member identifier (primary key)
        example: "m-00142"
      - name: first_name
        type: TEXT
        description: Member's first name
        example: "James"
      - name: last_name
        type: TEXT
        description: Member's last name
        example: "Thornton"
      - name: full_name
        type: TEXT
        description: Derived concatenation of first_name and last_name
        example: "James Thornton"
      - name: joined_at
        type: TIMESTAMPTZ
        description: Timestamp when the member joined the credit union
        example: "2019-04-12T00:00:00+00:00"
      - name: home_branch_name
        type: TEXT
        description: Name of the member's home branch
        example: "Downtown Branch"
      - name: home_branch_region
        type: TEXT
        description: Geographic region of the home branch (north/south/east/west/central)
        example: "north"

  - name: dim_officer
    description: >
      Loan officer dimension. One row per officer. Use for attribution of
      delinquency, origination volume, or portfolio balance to a specific officer.
    columns:
      - name: officer_id
        type: TEXT
        description: Unique officer identifier (primary key)
        example: "off-007"
      - name: officer_name
        type: TEXT
        description: Officer's full name
        example: "Sarah Chen"
      - name: hired_at
        type: TIMESTAMPTZ
        description: Timestamp when the officer was hired
        example: "2021-06-01T00:00:00+00:00"
      - name: status
        type: TEXT
        description: "Officer employment status: active or inactive"
        example: "active"
      - name: branch_name
        type: TEXT
        description: Name of the officer's assigned branch
        example: "Eastside Branch"
      - name: branch_region
        type: TEXT
        description: Geographic region of the officer's branch
        example: "east"

  - name: dim_deposit_product
    description: >
      Deposit product catalog. One row per product type. Use for slicing
      fct_deposits_monthly by product and filtering to core vs non-core deposits.
    columns:
      - name: deposit_product_id
        type: TEXT
        description: Unique deposit product identifier (primary key)
        example: "dp-checking-01"
      - name: product_name
        type: TEXT
        description: Human-readable deposit product name
        example: "High-Yield Savings"
      - name: is_core_deposit
        type: BOOLEAN
        description: >
          True for core deposits (checking, savings, money market).
          False for non-core (CDs, brokered deposits).
        example: "true"
      - name: deposit_category
        type: TEXT
        description: "Derived label: 'Core' or 'Non-Core'"
        example: "Core"

  - name: dim_calendar
    description: >
      Date spine covering 2022-07-01 through 2026-06-30. One row per calendar
      day. Use for date arithmetic, fiscal year filtering, and month-end joins.
      Fiscal year runs July–June (fiscal_year 2025 = Jul 2024–Jun 2025).
    columns:
      - name: calendar_date
        type: DATE
        description: The calendar date (primary key)
        example: "2024-03-31"
      - name: month_start_date
        type: DATE
        description: First day of the month containing calendar_date
        example: "2024-03-01"
      - name: month_end_date
        type: DATE
        description: Last day of the month containing calendar_date
        example: "2024-03-31"
      - name: year
        type: INT
        description: Calendar year (e.g. 2024)
        example: "2024"
      - name: month_num
        type: INT
        description: Calendar month number (1–12)
        example: "3"
      - name: quarter
        type: INT
        description: Calendar quarter (1–4)
        example: "1"
      - name: fiscal_year
        type: INT
        description: "Fiscal year (July–June). Jul 2024 through Jun 2025 = fiscal_year 2025."
        example: "2025"
      - name: is_month_end
        type: BOOLEAN
        description: True when calendar_date is the last day of its month
        example: "true"

  - name: fct_loans_monthly
    description: >
      Monthly loan portfolio rollup at (as_of_month, product_type, branch_id,
      officer_id) grain. Use for total balance, count, rate, and single-loan
      customer metrics. One row per grain combination per month.
    columns:
      - name: as_of_month
        type: DATE
        description: First day of the reporting month (always the 1st)
        example: "2024-03-01"
      - name: product_type
        type: TEXT
        description: Loan product code; one of auto_direct, auto_indirect, first_mortgage, heloc, closed_end_2nd, credit_card
        example: "first_mortgage"
      - name: branch_id
        type: INT
        description: Branch identifier — joins to branches table
        example: "3"
      - name: officer_id
        type: TEXT
        description: Loan officer identifier — joins to dim_officer
        example: "off-007"
      - name: loan_count
        type: INT
        description: Number of distinct loans active in this grain at month-end
        example: "42"
      - name: total_balance
        type: NUMERIC
        description: Sum of outstanding principal balances for loans in this grain
        example: "1820500.00"
      - name: avg_balance
        type: NUMERIC
        description: Average outstanding principal balance per loan in this grain
        example: "43345.24"
      - name: weighted_avg_rate
        type: NUMERIC
        description: Balance-weighted average annual interest rate as a decimal
        example: "0.0612"
      - name: single_loan_customer_count
        type: INT
        description: Members who have exactly one loan in this grain (used for LTD ratio)
        example: "38"
      - name: row_id
        type: TEXT
        description: Surrogate key — concatenation of as_of_month, product_type, branch_id, officer_id
        example: "2024-03-01|auto|3|off-007"

  - name: fct_deposits_monthly
    description: >
      Monthly deposit portfolio rollup at (as_of_month, deposit_product_id,
      branch_id) grain. Use for total balance, MTD/YTD change, account counts,
      and opened/closed flow. Deposits are single-source (Symitar only) and are
      excluded from loan reconciliation metrics.
    columns:
      - name: as_of_month
        type: DATE
        description: First day of the reporting month
        example: "2024-03-01"
      - name: deposit_product_id
        type: TEXT
        description: Deposit product identifier — joins to dim_deposit_product
        example: "dp-savings-01"
      - name: branch_id
        type: INT
        description: Branch identifier — joins to branches table
        example: "2"
      - name: account_count
        type: INT
        description: Number of active accounts in this grain at month-end
        example: "215"
      - name: total_balance
        type: NUMERIC
        description: Sum of current balances for accounts active in this grain
        example: "4320000.00"
      - name: avg_balance_per_customer
        type: NUMERIC
        description: total_balance divided by account_count
        example: "20093.02"
      - name: opened_count
        type: INT
        description: Accounts opened during this month in this grain
        example: "8"
      - name: closed_count
        type: INT
        description: Accounts closed during this month in this grain
        example: "3"
      - name: mtd_change
        type: NUMERIC
        description: Change in total_balance vs prior month for this grain
        example: "85000.00"
      - name: ytd_change
        type: NUMERIC
        description: Change in total_balance since the start of the fiscal year for this grain
        example: "310000.00"
      - name: is_core_deposit
        type: BOOLEAN
        description: Denormalized flag from dim_deposit_product — true for core products
        example: "true"
      - name: row_id
        type: TEXT
        description: Surrogate key — concatenation of as_of_month, deposit_product_id, branch_id
        example: "2024-03-01|dp-savings-01|2"

  - name: fct_delinquency_monthly
    description: >
      Monthly delinquency rollup at (as_of_month, officer_id, branch_id, bucket)
      grain. Only contains loans that are past due (30+ DPD). Use for past-due
      balance, loan count by aging bucket, and officer/branch attribution.
      Buckets are consolidated: '30-59', '60-89', '90+'.
    columns:
      - name: as_of_month
        type: DATE
        description: First day of the reporting month
        example: "2024-03-01"
      - name: officer_id
        type: TEXT
        description: Loan officer identifier — joins to dim_officer
        example: "off-004"
      - name: branch_id
        type: INT
        description: Branch identifier — joins to branches table
        example: "1"
      - name: bucket
        type: TEXT
        description: "Aging bucket: '30-59', '60-89', or '90+' (90-119 and 120+ are merged into 90+)"
        example: "30-59"
      - name: loan_count
        type: INT
        description: Number of distinct delinquent loans in this grain
        example: "7"
      - name: balance
        type: NUMERIC
        description: Sum of outstanding balances for delinquent loans in this grain
        example: "185000.00"
      - name: past_due_loan_count
        type: INT
        description: Count of loans in 30-59, 60-89, or 90+ buckets (always equals loan_count here)
        example: "7"
      - name: is_in_13_month_window
        type: BOOLEAN
        description: True when as_of_month is within the trailing 13-month window from today
        example: "true"
      - name: row_id
        type: TEXT
        description: Surrogate key — concatenation of as_of_month, officer_id, bucket
        example: "2024-03-01|off-004|30-59"

  - name: fct_loan_lifecycle_events
    description: >
      Monthly loan lifecycle event counts at (as_of_month, product_type,
      event_type) grain. event_type is either 'new' (newly funded) or
      'paid_off'. Use for origination vs payoff trend analysis.
    columns:
      - name: as_of_month
        type: DATE
        description: First day of the month when the event occurred
        example: "2024-03-01"
      - name: product_type
        type: TEXT
        description: Loan product code; one of auto_direct, auto_indirect, first_mortgage, heloc, closed_end_2nd, credit_card
        example: "personal"
      - name: event_type
        type: TEXT
        description: "Lifecycle event type: 'new' (funded) or 'paid_off'"
        example: "new"
      - name: loan_count
        type: INT
        description: Number of distinct loans with this event type in this grain
        example: "14"
      - name: total_amount
        type: NUMERIC
        description: >
          Sum of funded_amount (new) or original_balance (paid_off)
          for loans in this grain
        example: "320000.00"
      - name: row_id
        type: TEXT
        description: Surrogate key — concatenation of as_of_month, product_type, event_type
        example: "2024-03-01|personal|new"

  - name: fct_executive_kpis
    description: >
      Monthly executive KPI rollup at as_of_month grain. One row per month.
      Aggregates across all products and branches. Use for top-line metrics:
      loan-to-deposit ratio, core deposit ratio, blended past-due ratio,
      rate spread, and month-over-month growth.
    columns:
      - name: as_of_month
        type: DATE
        description: First day of the reporting month (primary key — one row per month)
        example: "2024-03-01"
      - name: total_loans_balance
        type: NUMERIC
        description: Total outstanding principal balance across all loans
        example: "48500000.00"
      - name: total_deposits_balance
        type: NUMERIC
        description: Total deposit balance across all products and branches
        example: "62300000.00"
      - name: loan_to_deposit_ratio
        type: NUMERIC
        description: "total_loans_balance / total_deposits_balance (decimal, e.g. 0.778)"
        example: "0.778"
      - name: core_deposit_ratio
        type: NUMERIC
        description: Core deposit balance / total deposit balance (decimal)
        example: "0.821"
      - name: blended_past_due_ratio
        type: NUMERIC
        description: Past-due (30+ DPD) balance / total loans balance (decimal)
        example: "0.032"
      - name: monthly_loan_growth
        type: NUMERIC
        description: Change in total_loans_balance vs prior month (dollar amount)
        example: "425000.00"
      - name: monthly_deposit_growth
        type: NUMERIC
        description: Change in total_deposits_balance vs prior month (dollar amount)
        example: "610000.00"
      - name: weighted_avg_loan_rate
        type: NUMERIC
        description: Balance-weighted average loan rate across all products (decimal)
        example: "0.0598"
      - name: weighted_avg_deposit_rate
        type: NUMERIC
        description: Balance-weighted average deposit cost rate (decimal)
        example: "0.0215"
      - name: rate_spread
        type: NUMERIC
        description: weighted_avg_loan_rate minus weighted_avg_deposit_rate (net interest margin proxy)
        example: "0.0383"
      - name: row_id
        type: TEXT
        description: as_of_month cast to TEXT (surrogate key)
        example: "2024-03-01"

  # =====================================================================
  # HUG-165: new tables from the data-model revamp (HUG-160 epic)
  # =====================================================================

  - name: dim_dealer
    description: >
      Auto-lending dealer dimension (Origence indirect channel). 25 rows.
      Pareto-distributed — top 5 dealers receive ~60% of indirect bookings.
      Joined to dim_loan via dealer_id (NOT NULL only on auto_indirect loans).
    columns:
      - name: dealer_id
        type: TEXT
        description: Dealer identifier; NOT NULL on auto_indirect loans, NULL otherwise
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: dealer_name
        type: TEXT
        description: Trade name of the dealer
        example: "Maple Auto"
      - name: dealer_type
        type: TEXT
        description: "Channel type: auto_franchise (OEM authorized) or auto_independent"
        example: "auto_franchise"
      - name: markup_tier
        type: TEXT
        description: "Pricing tier: standard | premium | aggressive — drives dealer reserve rate"
        example: "standard"
      - name: is_active
        type: BOOLEAN
        description: True when active_until is NULL (dealer still onboarded)
        example: "true"

  - name: dim_household
    description: >
      Household dimension. One row per household (single, paired, or
      multi_generation). Each member belongs to exactly one household via
      bridge_household_member. Use for true household-balance analytics.
    columns:
      - name: household_id
        type: TEXT
        description: Unique household identifier
        example: "11111111-2222-3333-4444-555555555555"
      - name: primary_member_id
        type: TEXT
        description: member_id of the primary household contact
        example: "m-00142"
      - name: household_type
        type: TEXT
        description: "single (1 member), paired (2), or multi_generation (3+)"
        example: "paired"
      - name: total_members
        type: INT
        description: Count of currently-active household members
        example: "2"

  - name: bridge_account_owner
    description: >
      Member-to-account bridge with role. Use for joint ownership analysis.
      One row per (member, loan-or-deposit-account, role). owner_kind
      distinguishes loan vs. deposit; owner_account_id is the loan_id or
      deposit account_id.
    columns:
      - name: owner_kind
        type: TEXT
        description: "'loan' or 'deposit' — distinguishes loan vs. share account"
        example: "deposit"
      - name: owner_account_id
        type: TEXT
        description: loan_id (when owner_kind='loan') or deposit account_id
        example: "abc-123"
      - name: member_id
        type: TEXT
        description: Member who owns the account in this role
        example: "m-00142"
      - name: role
        type: TEXT
        description: "primary | joint | pod_beneficiary | authorized_signer"
        example: "joint"
      - name: is_current
        type: BOOLEAN
        description: True when until_at is NULL (relationship still active)
        example: "true"

  - name: fct_call_report
    description: >
      NCUA 5300 quarterly line items rolled up from dim_loan + dim_deposit_product
      + the CECL roll-forward. One row per (period_end_quarter × line_code).
      Use for regulatory totals; cross-checks must reconcile to dim_loan /
      deposit_accounts within $1.
    columns:
      - name: period_end_quarter
        type: DATE
        description: Last day of the calendar quarter (Mar 31, Jun 30, Sep 30, Dec 31)
        example: "2025-12-31"
      - name: ncua_5300_line_code
        type: TEXT
        description: NCUA 5300 line item identifier (e.g., '386' for Total Loans)
        example: "386"
      - name: schedule
        type: TEXT
        description: "5300 schedule: CB (loans/shares), CL (allowance), CI (income), RC (assets)"
        example: "CB"
      - name: label
        type: TEXT
        description: Human-readable line item description
        example: "Total Loans Outstanding"
      - name: line_value
        type: NUMERIC
        description: Dollar value reported on this line for the quarter
        example: "42500000.00"

  - name: dim_cecl_segment
    description: >
      CECL segment dimension. 4 rows: consumer_auto, real_estate_1st,
      real_estate_junior, credit_card. Carries the DPD-band loss rates
      used to compute expected allowance.
    columns:
      - name: segment_code
        type: TEXT
        description: "Segment id: consumer_auto | real_estate_1st | real_estate_junior | credit_card"
        example: "consumer_auto"
      - name: segment_label
        type: TEXT
        description: Human-readable segment name
        example: "Consumer — Auto"
      - name: expected_loss_rate_current
        type: NUMERIC
        description: Annualized expected loss rate on current loans (decimal)
        example: "0.0040"
      - name: loss_rate_30_59
        type: NUMERIC
        description: Loss rate on 30-59 DPD loans
        example: "0.04"
      - name: loss_rate_60_89
        type: NUMERIC
        description: Loss rate on 60-89 DPD loans
        example: "0.18"
      - name: loss_rate_90_plus
        type: NUMERIC
        description: Loss rate on 90+ DPD loans
        example: "0.55"

  - name: fct_cecl_allowance_rollforward
    description: >
      CECL allowance roll-forward by month and segment. Closure invariant:
      ending_balance(t) = beginning_balance(t) - net_charge_offs(t) +
      provision_expense(t) (zero tolerance). Loss rates calibrated to 2024
      NCUA aggregates. Use for ALLL / coverage analytics.
    columns:
      - name: period_end_month
        type: DATE
        description: Month-start date (always day 1)
        example: "2025-12-01"
      - name: cecl_segment_code
        type: TEXT
        description: "Segment: consumer_auto | real_estate_1st | real_estate_junior | credit_card"
        example: "consumer_auto"
      - name: beginning_balance
        type: NUMERIC
        description: Allowance at start of month
        example: "1250000.00"
      - name: charge_offs
        type: NUMERIC
        description: Principal charged off during the month
        example: "45000.00"
      - name: recoveries
        type: NUMERIC
        description: Recoveries on previously charged-off principal (~20% of prior charge-offs)
        example: "9000.00"
      - name: net_charge_offs
        type: NUMERIC
        description: charge_offs minus recoveries
        example: "36000.00"
      - name: provision_expense
        type: NUMERIC
        description: Period P&L expense; the plug that closes the roll-forward
        example: "62000.00"
      - name: ending_balance
        type: NUMERIC
        description: Allowance at end of month (equals expected loss)
        example: "1276000.00"
