tables:
  - name: fct_loan_originations
    description: >
      One row per matched funded loan linking the Origence LOS application to the
      Symitar booked loan. Use this table for origination volume, approval rate,
      funding rate, and average loan amount queries. Only contains matched loans.
    columns:
      - name: loan_id
        type: TEXT
        description: Unique loan identifier assigned by Symitar core system
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: application_id
        type: TEXT
        description: Origence LOS application identifier
        example: "8826d916-cdfb-21c6-c1ff-91a761565a70"
      - name: member_id
        type: TEXT
        description: Credit union member identifier (links applicant to member record)
        example: "m-00142"
      - name: product_type
        type: TEXT
        description: Loan product category (e.g. auto, personal, mortgage)
        example: "auto"
      - name: channel
        type: TEXT
        description: Application submission channel (branch, online, mobile, dealer, broker)
        example: "online"
      - name: branch_name
        type: TEXT
        description: Name of the branch that originated the loan
        example: "Downtown Branch"
      - name: branch_region
        type: TEXT
        description: Geographic region of the originating branch (north, south, east, west, central)
        example: "north"
      - name: applied_at
        type: TIMESTAMPTZ
        description: Timestamp when the member submitted the loan application
        example: "2024-03-15T09:22:00+00:00"
      - name: funded_at
        type: TIMESTAMPTZ
        description: >
          Timestamp when the loan was funded. USE THIS as the origination date
          for volume metrics — not applied_at or originated_at.
        example: "2024-03-22T14:05:00+00:00"
      - name: originated_at
        type: TIMESTAMPTZ
        description: Timestamp when the loan was booked in Symitar (may differ slightly from funded_at)
        example: "2024-03-22T14:10:00+00:00"
      - name: requested_amount
        type: NUMERIC
        description: Dollar amount the member requested in the application
        example: "25000.00"
      - name: funded_amount
        type: NUMERIC
        description: Actual dollar amount funded (may differ from requested_amount)
        example: "22500.00"
      - name: original_balance
        type: NUMERIC
        description: Starting principal balance at loan origination (from Symitar)
        example: "22500.00"
      - name: rate
        type: NUMERIC
        description: Annual interest rate as a decimal (e.g. 0.0625 = 6.25%)
        example: "0.0625"
      - name: term_months
        type: INT
        description: Loan term in months
        example: "60"
      - name: maturity_at
        type: TIMESTAMPTZ
        description: Scheduled maturity date of the loan
        example: "2029-03-22T00:00:00+00:00"
      - name: loan_status
        type: TEXT
        description: "Current loan status: current, delinquent, charged_off, paid_off"
        example: "current"
      - name: match_type
        type: TEXT
        description: "Reconciliation match type — always 'matched' in this table"
        example: "matched"

  - name: fct_loan_performance
    description: >
      Monthly balance snapshot per loan with delinquency status. One row per
      (loan_id, snapshot_date) pair. Use this for portfolio balance trends,
      delinquency rates, and point-in-time performance analysis.
    columns:
      - name: loan_id
        type: TEXT
        description: Loan identifier — joins to fct_loan_originations and dim_loan
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: snapshot_date
        type: DATE
        description: >
          Date of the balance snapshot. Always specify this date when querying
          portfolio balance or delinquency — these are point-in-time metrics.
        example: "2024-03-31"
      - name: balance
        type: NUMERIC
        description: Outstanding principal balance on the snapshot date
        example: "21850.45"
      - name: loan_status
        type: TEXT
        description: "Loan status at snapshot date: current, delinquent, charged_off, paid_off"
        example: "current"
      - name: days_past_due
        type: INT
        description: >
          Number of days the loan payment is past due on the snapshot date.
          0 means current. Use >= 30 for delinquency threshold.
        example: "0"
      - name: delinquency_bucket
        type: TEXT
        description: "DPD bucket label: '30-59', '60-89', '90+', or null if current"
        example: "30-59"
      - name: is_delinquent
        type: BOOLEAN
        description: "True when days_past_due >= 30. Shorthand flag for 30+ DPD delinquency."
        example: "false"

  - name: dim_loan
    description: >
      Loan dimension table with product, channel, branch, and term attributes.
      Contains ALL booked loans (not just matched ones). Use for slicing metrics
      by product, channel, or branch when you need the full portfolio view.
    columns:
      - name: loan_id
        type: TEXT
        description: Unique loan identifier (primary key)
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: product_type
        type: TEXT
        description: Loan product category (auto, personal, mortgage, etc.)
        example: "auto"
      - name: channel
        type: TEXT
        description: >
          Application channel (branch, online, mobile, dealer, broker).
          'unknown' for loans without a matched LOS application.
        example: "branch"
      - name: branch_name
        type: TEXT
        description: Name of the originating branch
        example: "Westside Branch"
      - name: branch_region
        type: TEXT
        description: Geographic region of the originating branch
        example: "west"
      - name: rate_type
        type: TEXT
        description: "Interest rate type — always 'fixed' for this credit union"
        example: "fixed"
      - name: rate
        type: NUMERIC
        description: Annual interest rate as a decimal
        example: "0.0550"
      - name: term_months
        type: INT
        description: Loan term in months
        example: "48"
      - name: originated_at
        type: TIMESTAMPTZ
        description: Loan origination timestamp in Symitar
        example: "2024-01-10T11:30:00+00:00"
      - name: maturity_at
        type: TIMESTAMPTZ
        description: Scheduled maturity date
        example: "2028-01-10T00:00:00+00:00"
      - name: status
        type: TEXT
        description: "Current loan status: current, delinquent, charged_off, paid_off"
        example: "current"

  - name: recon_bridge
    description: >
      Reconciliation bridge enriched with human-readable labels. Shows how
      Origence LOS applications map (or fail to map) to Symitar booked loans.
      match_type 'matched' = direct link; 'ambiguous' = heuristic match by member;
      'unmatched' = no corresponding LOS application found.
    columns:
      - name: bridge_id
        type: INT
        description: Surrogate primary key for the reconciliation record
        example: "1"
      - name: application_id
        type: TEXT
        description: Origence LOS application_id (null for unmatched loans)
        example: "8826d916-cdfb-21c6-c1ff-91a761565a70"
      - name: loan_id
        type: TEXT
        description: Symitar booked loan_id
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - name: match_type
        type: TEXT
        description: "matched | ambiguous | unmatched"
        example: "matched"
      - name: match_label
        type: TEXT
        description: Human-readable match description (Direct LOS Match / Heuristic Match / No Match Found)
        example: "Direct LOS Match"
      - name: has_los_link
        type: BOOLEAN
        description: True when application_id is not null (LOS record exists)
        example: "true"
      - name: has_symitar_link
        type: BOOLEAN
        description: True when loan_id is not null (Symitar record exists)
        example: "true"
      - name: created_at
        type: TIMESTAMPTZ
        description: Timestamp when the reconciliation record was created
        example: "2024-04-01T00:00:00+00:00"
