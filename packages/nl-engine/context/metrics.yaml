metrics:
  - name: origination_volume
    label: Origination Volume
    description: Total number of loan applications received in a period
    formula_plain_english: >
      Count all loan applications where the application date falls within the
      requested time period. Includes every status unless filtered.
    caveats: >
      Includes all application statuses (pending, approved, declined, withdrawn).
      Filter by status for specific counts. Use funded_at for funded-loan volume,
      applied_at for application submission volume.
    related_questions:
      - "How many loans did we originate last month?"
      - "What is our origination volume by channel this year?"
      - "How many applications did we receive in Q1?"
      - "Show me origination trends over the last 12 months"

  - name: approval_rate
    label: Approval Rate
    description: Percentage of completed applications that were approved
    formula_plain_english: >
      Divide the number of approved decisions by the total number of completed
      decisions (approved + declined). Exclude pending and withdrawn applications
      from both numerator and denominator.
    caveats: >
      Excludes withdrawn and in-progress applications — denominator is completed
      decisions only. A high approval rate with low volume may indicate tighter
      application screening rather than improved underwriting.
    related_questions:
      - "What was our approval rate last quarter?"
      - "How does approval rate vary by branch?"
      - "What is the approval rate for auto loans vs personal loans?"
      - "Has our approval rate improved this year?"

  - name: funding_rate
    label: Funding Rate
    description: Percentage of approved applications that were funded
    formula_plain_english: >
      Divide the count of distinct funded applications by the count of approved
      applications. A funding event must exist in the LOS for a loan to count
      as funded.
    caveats: >
      Denominator is approved applications only, not total applications.
      Approved-but-not-yet-funded applications reduce this rate.
      Use recon_bridge match_rate for LOS-to-core reconciliation instead.
    related_questions:
      - "What percentage of approved loans were actually funded?"
      - "What is our pull-through rate?"
      - "How many approvals did not result in funded loans?"

  - name: avg_loan_amount
    label: Average Loan Amount
    description: Mean funded loan amount in a period
    formula_plain_english: >
      Calculate the average of funded_amount across all funding events where
      the funded_at date falls within the requested period.
    caveats: >
      Uses funded_amount (actual disbursed amount), not requested_amount.
      Use funded_at as the date field, not applied_at or originated_at.
      Outliers (very large or very small loans) can skew the average.
    related_questions:
      - "What is the average loan size this year?"
      - "How does average loan amount compare across product types?"
      - "What was the average funded amount last quarter?"
      - "Show average loan size by branch"

  - name: portfolio_balance
    label: Portfolio Balance
    description: Total outstanding principal balance of all active booked loans
    formula_plain_english: >
      Sum the current outstanding balance across all active booked loans as of
      a specific date. Always requires specifying the as-of date because balances
      change daily with payments and new originations.
    caveats: >
      Uses the most recent balance snapshot from fct_loan_performance.
      Balance changes daily — always specify the snapshot_date.
      Excludes paid-off and charged-off loans (status = 'active' / 'current').
    related_questions:
      - "What is our total portfolio balance today?"
      - "How has our portfolio balance grown this year?"
      - "What is the outstanding balance by product type?"
      - "Show portfolio balance trend over the last 6 months"

  - name: delinquency_rate
    label: Delinquency Rate
    description: Percentage of active loans that are 30+ days past due
    formula_plain_english: >
      Divide the count of active loans with 30 or more days past due by the
      total count of active loans, as of a specific snapshot date.
    caveats: >
      Measured at a specific snapshot_date — not real-time.
      30+ DPD is the standard threshold. Use days_past_due >= 30 directly
      for precision; is_delinquent flag also captures 30+ DPD.
      60+ and 90+ bucket rates available via delinquency_bucket column.
    related_questions:
      - "What is our current delinquency rate?"
      - "How many loans are 30+ days past due?"
      - "What is the delinquency rate by branch?"
      - "Show delinquency trend over the last 12 months"
      - "How many loans are 90+ days past due?"

  - name: total_deposits
    label: Total Deposits Balance
    description: >
      Sum of current outstanding balance across all active deposit accounts
      as of a given month-end date.
    formula_plain_english: >
      Sum total_balance from fct_deposits_monthly where as_of_month equals
      the requested month. Group by as_of_month to get the portfolio-level total.
    caveats: >
      Point-in-time snapshot — always pair with an as_of_date.
      Excludes closed accounts. Deposits are single-source (Symitar only)
      and have no Origence LOS counterpart — excluded from reconciliation metrics.
    related_questions:
      - "What is our total deposit balance this month?"
      - "How have total deposits grown over the past year?"
      - "What is the deposit balance as of March 2024?"
      - "Show total deposits by month for the last 12 months"

  - name: mtd_deposit_change
    label: MTD Deposit Change
    description: >
      Month-to-date change in total deposit balance compared to the prior
      month-end for each grain (product + branch).
    formula_plain_english: >
      Sum mtd_change from fct_deposits_monthly for the requested as_of_month.
      Positive values indicate deposit growth; negative values indicate outflows.
    caveats: >
      MTD change is pre-computed in the mart as current month total_balance
      minus prior month total_balance. Not available for the earliest month
      in the data set (no prior month to compare).
    related_questions:
      - "How much have deposits grown this month?"
      - "What is the month-over-month deposit change?"
      - "Which product had the largest deposit inflow this month?"
      - "Show MTD deposit change by branch"

  - name: ytd_deposit_change
    label: YTD Deposit Change
    description: >
      Year-to-date change in total deposit balance from the start of the
      fiscal year (July 1) to the requested month-end.
    formula_plain_english: >
      Sum ytd_change from fct_deposits_monthly for the requested as_of_month.
      Fiscal year resets each July 1 — ytd_change is zero at the start of
      each fiscal year and accumulates through June.
    caveats: >
      Fiscal year runs July through June. ytd_change resets to zero at the
      start of each new fiscal year. Use mtd_deposit_change for single-month
      movement; ytd_deposit_change for cumulative annual trend.
    related_questions:
      - "How much have deposits grown this fiscal year?"
      - "What is the year-to-date deposit change by product?"
      - "Show YTD deposit growth compared to last fiscal year"
      - "Which branch has the highest YTD deposit inflow?"

  - name: avg_balance_per_customer
    label: Average Deposit Balance per Customer
    description: >
      Average deposit balance per account holder as of a given month-end,
      calculated at the (product, branch) grain.
    formula_plain_english: >
      Divide total_balance by account_count from fct_deposits_monthly for
      the requested as_of_month. This equals avg_balance_per_customer directly.
    caveats: >
      Account-level average — a member with multiple accounts is counted once
      per account per grain. For member-level average, aggregate across products
      and branches before dividing.
    related_questions:
      - "What is the average deposit balance per customer?"
      - "How does average balance compare across product types?"
      - "What is the average savings account balance?"
      - "Show average deposit balance by branch"

  - name: top_n_deposits
    label: Top N Depositors
    description: >
      The members with the highest total deposit balances as of the most
      recent snapshot, ranked in descending order.
    formula_plain_english: >
      Join deposit_accounts to members, sum current_balance per member,
      then order descending and take the top N rows. N defaults to 25
      unless the user specifies otherwise.
    caveats: >
      Uses live deposit_accounts.current_balance, not the monthly mart.
      Includes all open accounts per member. N defaults to 25 if unspecified.
      Do not expose member PII beyond first name + last name.
    related_questions:
      - "Who are our top 10 depositors?"
      - "Show me the top 25 members by deposit balance"
      - "Which members have the largest total deposits?"
      - "List the biggest depositors at the Downtown branch"

  - name: deposits_by_product
    label: Deposits by Product
    description: >
      Total deposit balance broken down by deposit product type (e.g.
      checking, savings, money market, CD) as of a given month-end.
    formula_plain_english: >
      Join fct_deposits_monthly to dim_deposit_product on deposit_product_id,
      sum total_balance grouped by product_name for the requested as_of_month.
    caveats: >
      Product taxonomy is defined in dim_deposit_product — use product_name
      for display and is_core_deposit to separate core from non-core products.
    related_questions:
      - "What is the deposit breakdown by product type?"
      - "How much is held in CDs vs savings accounts?"
      - "Show deposit mix by product this month"
      - "What percentage of deposits are in checking accounts?"

  - name: deposits_by_branch
    label: Deposits by Branch
    description: >
      Total deposit balance grouped by branch as of a given month-end date.
    formula_plain_english: >
      Join fct_deposits_monthly to branches on branch_id, sum total_balance
      grouped by branch name for the requested as_of_month.
    caveats: >
      Branch attribution is based on the account's home branch at open time —
      it does not change if the member later transfers to another branch.
    related_questions:
      - "Which branch holds the most deposits?"
      - "Show deposit balance by branch this month"
      - "How do deposit balances compare across branches?"
      - "What is the deposit total for the Westside branch?"

  - name: total_loans
    label: Total Loans Balance
    description: >
      Total outstanding principal balance across all active booked loans as
      of a given month-end. Equivalent to portfolio_balance but sourced from
      the fct_loans_monthly mart for dashboard consistency.
    formula_plain_english: >
      Sum total_balance from fct_loans_monthly for the requested as_of_month,
      summing across all product_type, branch_id, and officer_id combinations.
    caveats: >
      Use fct_loans_monthly (not fct_loan_performance) when querying alongside
      deposit metrics so both sides share the same monthly grain.
      Excludes paid-off and charged-off loans.
    related_questions:
      - "What is our total loan portfolio balance?"
      - "How have total loans grown this year?"
      - "What is the total outstanding loan balance by product?"
      - "Show total loans balance trend over the last 12 months"

  - name: top_n_borrowers
    label: Top N Borrowers
    description: >
      The members with the highest total outstanding loan balances as of the
      most recent snapshot, ranked in descending order.
    formula_plain_english: >
      Join booked_loans to loan_balances for the most recent snapshot_date,
      sum balance per member_id, join to members for names, order descending
      and take the top N rows. N defaults to 25 unless specified.
    caveats: >
      Sums all active loans per member — a member with multiple loans appears
      once with their total exposure. N defaults to 25 if unspecified.
      Only active/current loans; excludes paid-off and charged-off.
    related_questions:
      - "Who are our top 10 borrowers by outstanding balance?"
      - "Show the members with the highest total loan exposure"
      - "Which members have the largest outstanding loan balances?"
      - "List the top 25 borrowers at the Eastside branch"

  - name: single_loan_customers
    label: Single-Loan Customers
    description: >
      Count of members who have exactly one active loan, used as a proxy for
      cross-sell opportunity and member engagement depth.
    formula_plain_english: >
      Sum single_loan_customer_count from fct_loans_monthly for the requested
      as_of_month, summing across all grains to get the portfolio-level count.
    caveats: >
      A member counted as single-loan in one grain (product+branch+officer)
      may have loans in another grain — sum across all grains carefully or
      use the pre-aggregated value from fct_executive_kpis to avoid
      double-counting.
    related_questions:
      - "How many members have exactly one loan?"
      - "What percentage of borrowers have only one loan product?"
      - "Show single-loan customer count by product type"
      - "How has the count of single-loan members changed this year?"

  - name: past_due_ratio
    label: Blended Past Due Ratio
    description: >
      Dollar-weighted percentage of the total loan portfolio that is 30 or
      more days past due, blended across all product types.
    formula_plain_english: >
      Divide the sum of balance for buckets '30-59', '60-89', and '90+' in
      fct_delinquency_monthly by the sum of total_balance in fct_loans_monthly,
      both filtered to the same as_of_month.
    caveats: >
      Cross-product blend — per-product rates can differ significantly from
      the portfolio average. Use delinquency_aging_distribution for bucket
      breakdown. Sourced from fct_delinquency_monthly joined to fct_loans_monthly.
    related_questions:
      - "What is our current past due ratio?"
      - "What percentage of the portfolio is past due?"
      - "Show past due ratio trend over the last 12 months"
      - "How does our blended past due ratio compare month over month?"

  - name: nonaccrual_balance
    label: Nonaccrual Balance
    description: >
      Outstanding principal balance on loans where interest accrual has been
      suspended due to credit deterioration.
    formula_plain_english: >
      Join booked_loans to loan_balances on loan_id, sum balance where
      booked_loans.is_nonaccrual = TRUE and loan_balances.snapshot_date is
      the most recent date on or before the requested as_of date.
    caveats: >
      Typically triggered at 90+ DPD per NCUA guidance, but policy varies.
      Nonaccrual loans are a subset of NPL balance and overlap with 90+ bucket.
      Use is_nonaccrual flag on booked_loans — not derivable from
      fct_delinquency_monthly.
    related_questions:
      - "What is our current nonaccrual balance?"
      - "How much in loans is on nonaccrual status?"
      - "Show nonaccrual balance trend over the last year"
      - "Which product type has the most nonaccrual exposure?"

  - name: watchlist_count
    label: Watchlist Count
    description: >
      Number of loans currently on the credit watchlist as of a given date,
      indicating heightened credit monitoring.
    formula_plain_english: >
      Count rows in the watchlist table where added_at date is on or before
      the requested date AND removed_at is NULL or after the requested date.
    caveats: >
      Point-in-time count — loans enter and exit the watchlist over time.
      A loan on the watchlist is not necessarily delinquent — watchlist is
      a forward-looking risk indicator, not a lagging delinquency measure.
    related_questions:
      - "How many loans are currently on the watchlist?"
      - "Show watchlist count trend over the last 12 months"
      - "How many loans were added to the watchlist this month?"
      - "What is the total balance of watchlisted loans?"

  - name: nonperforming_loan_balance
    label: Nonperforming Loan (NPL) Balance
    description: >
      Outstanding principal balance of loans that are 90 or more days past
      due or on nonaccrual status — the broadest risk indicator.
    formula_plain_english: >
      Sum balance from fct_delinquency_monthly where bucket = '90+' for the
      requested as_of_month, then add nonaccrual balance for any loans not
      already captured in the 90+ bucket.
    caveats: >
      NPL balance is the broadest risk indicator on the Past Due dashboard.
      An increasing NPL balance is adverse — the frontend negates the delta
      so an increase renders as a downward (red) movement. Overlaps with
      nonaccrual_balance — do not double-count.
    related_questions:
      - "What is our nonperforming loan balance?"
      - "How much of the portfolio is in NPL status?"
      - "Show NPL balance trend over the last year"
      - "What percentage of the portfolio is nonperforming?"

  - name: loan_to_deposit_ratio
    label: Loan-to-Deposit Ratio
    description: >
      Total outstanding loan balance divided by total deposit balance as of
      a given month-end.
    formula_plain_english: >
      Divide total_loans_balance by total_deposits_balance from
      fct_executive_kpis for the requested as_of_month.
    caveats: >
      Values above 1.0 indicate the CU is lending more than it holds in
      deposits. Regulatory guidance for community CUs typically targets
      0.80–0.90. Use fct_executive_kpis for this metric — it pre-computes
      the ratio with matched monthly grain.
    related_questions:
      - "What is our loan-to-deposit ratio?"
      - "How does our LTD ratio compare to the 80% target?"
      - "Show loan-to-deposit ratio trend over the last 12 months"
      - "Is our loan-to-deposit ratio increasing or decreasing?"

  - name: core_deposit_ratio
    label: Core Deposit Ratio
    description: >
      Core deposits (checking, savings, money market) as a share of total
      deposit balance, indicating funding stability.
    formula_plain_english: >
      Divide the sum of total_balance where is_core_deposit = TRUE by the
      total sum of total_balance from fct_deposits_monthly for the requested
      as_of_month. Or use core_deposit_ratio directly from fct_executive_kpis.
    caveats: >
      Higher ratios indicate more stable, lower-cost funding. CDs and
      brokered deposits are excluded from the numerator. Core products are
      flagged via dim_deposit_product.is_core_deposit.
    related_questions:
      - "What is our core deposit ratio?"
      - "What percentage of deposits are core deposits?"
      - "Show core deposit ratio trend over the past year"
      - "How much of our funding comes from core vs non-core deposits?"

  - name: monthly_growth_loans
    label: Monthly Loan Growth
    description: >
      Dollar change in total outstanding loan balance from the prior month
      to the current month.
    formula_plain_english: >
      Use monthly_loan_growth from fct_executive_kpis for the requested
      as_of_month. Positive values indicate portfolio growth; negative values
      indicate net run-off.
    caveats: >
      Pre-computed in the mart as current month total_loans_balance minus
      prior month total_loans_balance. Not available for the earliest month
      in the data set. For percentage growth, divide by prior month balance.
    related_questions:
      - "How much did the loan portfolio grow this month?"
      - "What is the month-over-month loan growth?"
      - "Show monthly loan growth trend for the last 12 months"
      - "Is the loan portfolio growing or shrinking?"

  - name: monthly_growth_deposits
    label: Monthly Deposit Growth
    description: >
      Dollar change in total deposit balance from the prior month to the
      current month.
    formula_plain_english: >
      Use monthly_deposit_growth from fct_executive_kpis for the requested
      as_of_month. Positive values indicate deposit inflow; negative values
      indicate net outflow.
    caveats: >
      Pre-computed in the mart as current month total_deposits_balance minus
      prior month. Not available for the earliest month in the data set.
      For product or branch breakdown, use mtd_deposit_change from
      fct_deposits_monthly instead.
    related_questions:
      - "How much did deposits grow this month?"
      - "What is the month-over-month deposit growth?"
      - "Show monthly deposit growth for the last 12 months"
      - "Are deposits growing faster than loans?"

  - name: rate_spread
    label: Rate Spread
    description: >
      Weighted average loan yield minus weighted average deposit cost —
      a simplified proxy for net interest margin.
    formula_plain_english: >
      Use rate_spread from fct_executive_kpis for the requested as_of_month.
      Equals weighted_avg_loan_rate minus weighted_avg_deposit_rate.
    caveats: >
      Simplified NIM proxy — does not account for operating expenses, credit
      losses, or non-interest income. Both rates are balance-weighted averages.
      A declining spread indicates margin compression.
    related_questions:
      - "What is our current rate spread?"
      - "How has our rate spread changed over the last year?"
      - "Show rate spread trend for the last 12 months"
      - "Is our net interest margin expanding or compressing?"

  - name: delinquency_aging_distribution
    label: Delinquency Aging Distribution
    description: >
      Breakdown of past-due loan balances by aging bucket: 30-59, 60-89,
      and 90+ days past due, for a given month-end.
    formula_plain_english: >
      Group fct_delinquency_monthly by bucket for the requested as_of_month,
      summing balance per bucket. Buckets are '30-59', '60-89', and '90+'.
      Use CASE WHEN to pivot into columns if side-by-side comparison needed.
    caveats: >
      90-119 DPD and 120+ DPD are merged into the '90+' bucket in the mart.
      Only loans that are actually past due appear — current loans have no
      row in fct_delinquency_monthly.
    related_questions:
      - "What is the breakdown of past due loans by aging bucket?"
      - "How much is in the 90+ day bucket vs 30-59?"
      - "Show delinquency aging distribution this month"
      - "What percentage of past-due balance is in the 90+ bucket?"

  # =====================================================================
  # HUG-165: new metrics from the data-model revamp
  # =====================================================================

  - name: household_balance
    label: Household Balance
    description: >
      Total deposit balance held by all members of a household. Joins
      bridge_account_owner (member→account) with deposit_accounts then
      sums by household_id. Use for true household-level wealth analytics
      — single-account-balance metrics under-represent the financial
      relationship the CU has with a member.
    formula_plain_english: >
      Sum of current_balance across all deposit_accounts whose owners
      (via bridge_account_owner) are members of the same household.
    caveats: >
      Joint owners would be double-counted if you sum naively across
      account_owners — use DISTINCT account_id or filter on role='primary'.
    related_questions:
      - "What is the total household balance for the top 10 households?"
      - "How does household balance differ from member balance?"
      - "Which households hold over $250,000?"

  - name: dealer_concentration_pct
    label: Dealer Concentration %
    description: >
      Share of indirect-auto loan balance booked through the top-N
      dealers. A high concentration (>60% in top 5) is a counterparty
      risk flag for examiners.
    formula_plain_english: >
      For top N dealers ranked by SUM(balance) on auto_indirect loans
      / total auto_indirect balance.
    caveats: >
      Only auto_indirect loans contribute. Direct auto and other products
      have NULL dealer_id and must be excluded.
    related_questions:
      - "What is our top-5 dealer concentration in indirect auto?"
      - "Which dealer originated the most loans this year?"
      - "How concentrated is our indirect-auto portfolio?"

  - name: ncua_total_loans
    label: Total Loans (NCUA 5300 line 386)
    description: >
      Total loans outstanding as reported on NCUA 5300 Schedule CB line 386.
      Reconciles to SUM(dim_loan.balance) WHERE status != 'paid_off' to
      within $1.
    formula_plain_english: >
      SUM(line_value) FROM fct_call_report WHERE ncua_5300_line_code = '386'.
    caveats: >
      Only quarter-end values exist. Off-quarter dates have no row.
    related_questions:
      - "What is our total loans outstanding for the latest quarter?"
      - "Show NCUA 5300 line 386 by quarter for the past 2 years"

  - name: cecl_allowance_balance
    label: CECL Allowance Balance
    description: >
      Period-end allowance for credit losses, by segment. From
      fct_cecl_allowance_rollforward.ending_balance.
    formula_plain_english: >
      Latest ending_balance per cecl_segment_code, summed for portfolio total.
    caveats: >
      Synthetic CECL uses a simplified DPD-band loss-rate model. Not
      a true CECL implementation — flagged in docs/metrics.md.
    related_questions:
      - "What is our CECL allowance balance this month?"
      - "How much did we provision in the latest quarter?"
      - "Show CECL allowance by segment"

  - name: cecl_provision_ytd
    label: CECL Provision YTD
    description: >
      Year-to-date provision-for-credit-losses expense (P&L hit). Sum of
      provision_expense across all months in the current fiscal year.
    formula_plain_english: >
      SUM(provision_expense) FROM fct_cecl_allowance_rollforward
      WHERE period_end_month BETWEEN fiscal-year start AND latest month.
    caveats: >
      Fiscal year is July–June at this CU. Use dim_calendar.fiscal_year
      to align.
    related_questions:
      - "What is our YTD provision for credit losses?"
      - "How much have we set aside for CECL this fiscal year?"
