questions:
- question: How many loans did we originate last month?
  ground_truth_sql: "SELECT COUNT(*) AS origination_count\nFROM fct_loan_originations\n\
    WHERE funded_at >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 month')\n  AND\
    \ funded_at <  DATE_TRUNC('month', CURRENT_DATE)\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - funded_at
  - DATE_TRUNC
  question_type: origination_volume
- question: What is our origination volume this year?
  ground_truth_sql: "SELECT\n  COUNT(*) AS origination_count,\n  ROUND(SUM(funded_amount),\
    \ 2) AS total_funded_amount\nFROM fct_loan_originations\nWHERE funded_at >= DATE_TRUNC('year',\
    \ CURRENT_DATE)\n  AND funded_at <  CURRENT_DATE + INTERVAL '1 day'\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - SUM
  - funded_at
  - DATE_TRUNC
  question_type: origination_volume
- question: How many loans did we fund in Q1 this year?
  ground_truth_sql: "SELECT COUNT(*) AS origination_count\nFROM fct_loan_originations\n\
    WHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)\n  AND funded_at <  DATE_TRUNC('year',\
    \ CURRENT_DATE) + INTERVAL '3 months'\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - funded_at
  - DATE_TRUNC
  question_type: origination_volume
- question: Show origination volume by channel this year
  ground_truth_sql: "SELECT\n  channel,\n  COUNT(*) AS origination_count,\n  ROUND(SUM(funded_amount),\
    \ 2) AS total_funded_amount\nFROM fct_loan_originations\nWHERE funded_at >= DATE_TRUNC('year',\
    \ CURRENT_DATE)\nGROUP BY channel\nORDER BY origination_count DESC\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - SUM
  - channel
  - GROUP BY
  - funded_at
  question_type: origination_volume
- question: What is origination volume by product type last quarter?
  ground_truth_sql: "SELECT\n  product_type,\n  COUNT(*) AS loan_count,\n  ROUND(AVG(funded_amount),\
    \ 2) AS avg_amount,\n  ROUND(SUM(funded_amount), 2) AS total_funded\nFROM fct_loan_originations\n\
    WHERE funded_at >= DATE_TRUNC('quarter', CURRENT_DATE - INTERVAL '3 months')\n\
    \  AND funded_at <  DATE_TRUNC('quarter', CURRENT_DATE)\nGROUP BY product_type\n\
    ORDER BY loan_count DESC\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - SUM
  - product_type
  - GROUP BY
  question_type: origination_volume
- question: Which branches had the highest origination volume this year?
  ground_truth_sql: "SELECT\n  branch_name,\n  branch_region,\n  COUNT(*) AS loan_count,\n\
    \  ROUND(SUM(funded_amount), 2) AS total_funded\nFROM fct_loan_originations\n\
    WHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)\nGROUP BY branch_name, branch_region\n\
    ORDER BY loan_count DESC\nLIMIT 5\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - branch_name
  - GROUP BY
  - ORDER BY
  - LIMIT
  question_type: origination_volume
- question: Show origination trends by month over the last 12 months
  ground_truth_sql: "SELECT\n  DATE_TRUNC('month', funded_at) AS month,\n  COUNT(*)\
    \ AS loan_count,\n  ROUND(SUM(funded_amount), 2) AS total_funded\nFROM fct_loan_originations\n\
    WHERE funded_at >= CURRENT_DATE - INTERVAL '12 months'\nGROUP BY DATE_TRUNC('month',\
    \ funded_at)\nORDER BY month\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - DATE_TRUNC
  - month
  - GROUP BY
  question_type: origination_volume
- question: What is the total funded amount this year?
  ground_truth_sql: "SELECT ROUND(SUM(funded_amount), 2) AS total_funded_amount\n\
    FROM fct_loan_originations\nWHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)\n\
    \  AND funded_at <  CURRENT_DATE + INTERVAL '1 day'\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - SUM
  - funded_amount
  - funded_at
  question_type: origination_volume
- question: How many auto loans did we originate last quarter?
  ground_truth_sql: "SELECT COUNT(*) AS auto_loan_count\nFROM fct_loan_originations\n\
    WHERE product_type = 'auto'\n  AND funded_at >= DATE_TRUNC('quarter', CURRENT_DATE\
    \ - INTERVAL '3 months')\n  AND funded_at <  DATE_TRUNC('quarter', CURRENT_DATE)\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - product_type
  - funded_at
  - DATE_TRUNC
  question_type: origination_volume
- question: How many loans did we originate in the north region this year?
  ground_truth_sql: "SELECT\n  COUNT(*) AS origination_count,\n  ROUND(SUM(funded_amount),\
    \ 2) AS total_funded\nFROM fct_loan_originations\nWHERE branch_region = 'north'\n\
    \  AND funded_at >= DATE_TRUNC('year', CURRENT_DATE)\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - branch_region
  - funded_at
  question_type: origination_volume
- question: What was our approval rate last quarter?
  ground_truth_sql: "SELECT\n  ROUND(\n    COUNT(CASE WHEN has_symitar_link THEN 1\
    \ END)::NUMERIC\n    / NULLIF(COUNT(CASE WHEN has_los_link THEN 1 END), 0) * 100,\n\
    \    2\n  ) AS approval_rate_pct\nFROM recon_bridge\nWHERE created_at >= DATE_TRUNC('quarter',\
    \ CURRENT_DATE - INTERVAL '3 months')\n  AND created_at <  DATE_TRUNC('quarter',\
    \ CURRENT_DATE)\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - approval_rate_pct
  - has_symitar_link
  - has_los_link
  question_type: approval_rate
- question: How does approval rate vary by product type?
  ground_truth_sql: "SELECT\n  product_type,\n  COUNT(*) AS funded_count\nFROM fct_loan_originations\n\
    WHERE funded_at >= DATE_TRUNC('year', CURRENT_DATE)\nGROUP BY product_type\nORDER\
    \ BY funded_count DESC\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - product_type
  - GROUP BY
  question_type: approval_rate
- question: What is the approval rate for auto loans vs personal loans last quarter?
  ground_truth_sql: "SELECT\n  product_type,\n  COUNT(*) AS funded_count\nFROM fct_loan_originations\n\
    WHERE product_type IN ('auto', 'personal')\n  AND funded_at >= DATE_TRUNC('quarter',\
    \ CURRENT_DATE - INTERVAL '3 months')\n  AND funded_at <  DATE_TRUNC('quarter',\
    \ CURRENT_DATE)\nGROUP BY product_type\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - product_type
  - funded_at
  - GROUP BY
  question_type: approval_rate
- question: How has our approval rate trended over the last 4 quarters?
  ground_truth_sql: "SELECT\n  DATE_TRUNC('quarter', funded_at) AS quarter,\n  COUNT(*)\
    \ AS funded_loans\nFROM fct_loan_originations\nWHERE funded_at >= CURRENT_DATE\
    \ - INTERVAL '12 months'\nGROUP BY DATE_TRUNC('quarter', funded_at)\nORDER BY\
    \ quarter\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - DATE_TRUNC
  - quarter
  - GROUP BY
  question_type: approval_rate
- question: What is the approval rate for online vs branch channel?
  ground_truth_sql: "SELECT\n  channel,\n  COUNT(*) AS funded_count\nFROM fct_loan_originations\n\
    WHERE channel IN ('online', 'branch')\n  AND funded_at >= DATE_TRUNC('year', CURRENT_DATE)\n\
    GROUP BY channel\nORDER BY funded_count DESC\n"
  expected_tables:
  - fct_loan_originations
  expected_keywords:
  - COUNT
  - channel
  - GROUP BY
  question_type: approval_rate
- question: What percentage of approved loans were actually funded?
  ground_truth_sql: "SELECT\n  ROUND(\n    COUNT(CASE WHEN has_symitar_link THEN 1\
    \ END)::NUMERIC\n    / NULLIF(COUNT(CASE WHEN has_los_link THEN 1 END), 0) * 100,\n\
    \    2\n  ) AS funding_rate_pct\nFROM recon_bridge\n"
  expected_tables:
  - recon_bridge
  expected_keywords:
  - COUNT
  - funding_rate_pct
  - has_symitar_link
  - has_los_link
  question_type: funding_rate
- question: What is our pull-through rate this year?
  ground_truth_sql: "SELECT\n  ROUND(\n    COUNT(CASE WHEN has_symitar_link THEN 1\
