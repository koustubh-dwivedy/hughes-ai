# ---- Dashboard: Past-Due ----
- question: What is our current blended past due ratio?
  ground_truth_sql: |
    WITH past_due AS (
        SELECT SUM(balance) AS past_due_bal
        FROM fct_delinquency_monthly
        WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_delinquency_monthly)
          AND bucket IN ('30-59', '60-89', '90+')
    ),
    total AS (
        SELECT SUM(total_balance) AS total_bal
        FROM fct_loans_monthly
        WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_loans_monthly)
    )
    SELECT
        ROUND(p.past_due_bal / NULLIF(t.total_bal, 0) * 100, 2) AS past_due_ratio_pct
    FROM past_due p, total t
  expected_tables:
  - fct_delinquency_monthly
  expected_keywords:
  - SUM
  - as_of_month
  - bucket
  question_type: past_due
- question: Which officers have the most past-due exposure?
  ground_truth_sql: |
    SELECT
        o.officer_name,
        ROUND(SUM(f.balance), 2)   AS past_due_balance,
        SUM(f.past_due_loan_count) AS past_due_loan_count
    FROM fct_delinquency_monthly f
    JOIN dim_officer o ON f.officer_id = o.officer_id
    WHERE f.as_of_month = (SELECT MAX(as_of_month) FROM fct_delinquency_monthly)
      AND f.bucket IN ('30-59', '60-89', '90+')
    GROUP BY o.officer_id, o.officer_name
    ORDER BY past_due_balance DESC
  expected_tables:
  - fct_delinquency_monthly
  expected_keywords:
  - SUM
  - GROUP BY
  - ORDER BY
  - officer_name
  question_type: past_due
- question: Show the delinquency trend by aging bucket over the last 13 months
  ground_truth_sql: |
    SELECT
        as_of_month                                                         AS month,
        ROUND(SUM(CASE WHEN bucket = '30-59' THEN balance ELSE 0 END), 2)  AS bucket_30_59,
        ROUND(SUM(CASE WHEN bucket = '60-89' THEN balance ELSE 0 END), 2)  AS bucket_60_89,
        ROUND(SUM(CASE WHEN bucket = '90+'   THEN balance ELSE 0 END), 2)  AS bucket_90_plus
    FROM fct_delinquency_monthly
    WHERE as_of_month >= (SELECT MAX(as_of_month) FROM fct_delinquency_monthly)
                          - INTERVAL '12 months'
    GROUP BY as_of_month
    ORDER BY as_of_month
  expected_tables:
  - fct_delinquency_monthly
  expected_keywords:
  - SUM
  - CASE WHEN
  - bucket
  - GROUP BY
  question_type: past_due
- question: How many loans are currently on the watchlist?
  ground_truth_sql: |
    SELECT
        COUNT(*)                              AS watchlist_count,
        COALESCE(SUM(bl.original_balance), 0) AS watchlist_balance
    FROM watchlist w
    LEFT JOIN booked_loans bl ON w.loan_id = bl.loan_id
    WHERE w.added_at::DATE <= CURRENT_DATE
      AND (w.removed_at IS NULL OR w.removed_at::DATE > CURRENT_DATE)
  expected_tables:
  - watchlist
  expected_keywords:
  - COUNT
  - added_at
  - removed_at
  question_type: watchlist
