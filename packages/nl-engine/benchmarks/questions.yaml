        ROUND(SUM(f.total_balance), 2) AS total_balance,
        SUM(f.account_count)           AS account_count
    FROM fct_deposits_monthly f
    JOIN branches b ON f.branch_id = b.branch_id
    WHERE f.as_of_month = (SELECT MAX(as_of_month) FROM fct_deposits_monthly)
    GROUP BY b.name
    ORDER BY total_balance DESC
