  # ─── EDGE CASES (5) ──────────────────────────────────────────────────────

  - question: "What is the average loan amount for mortgage loans this year?"
    ground_truth_sql: |
      SELECT ROUND(AVG(funded_amount), 2) AS avg_mortgage_amount
      FROM fct_loan_originations
      WHERE product_type = 'mortgage'
        AND funded_at >= DATE_TRUNC('year', CURRENT_DATE)
        AND funded_at <  CURRENT_DATE + INTERVAL '1 day'
    expected_tables: [fct_loan_originations]
    expected_keywords: [AVG, funded_amount, product_type, mortgage]
    question_type: edge_case

  - question: "How many unmatched loans are in our system?"
    ground_truth_sql: |
      SELECT COUNT(*) AS unmatched_count
      FROM recon_bridge
      WHERE match_type = 'unmatched'
    expected_tables: [recon_bridge]
    expected_keywords: [COUNT, match_type, unmatched]
    question_type: edge_case

  - question: "What is our reconciliation match rate?"
    ground_truth_sql: |
      SELECT
        ROUND(
          COUNT(CASE WHEN match_type = 'matched' THEN 1 END)::NUMERIC
          / NULLIF(COUNT(*), 0) * 100,
          2
        ) AS match_rate_pct
      FROM recon_bridge
    expected_tables: [recon_bridge]
    expected_keywords: [COUNT, match_type, match_rate_pct]
    question_type: edge_case

  - question: "Show average loan term in months by product type"
    ground_truth_sql: |
      SELECT
        product_type,
        ROUND(AVG(term_months), 1) AS avg_term_months
      FROM fct_loan_originations
      GROUP BY product_type
      ORDER BY avg_term_months DESC
    expected_tables: [fct_loan_originations]
    expected_keywords: [AVG, term_months, product_type, "GROUP BY"]
    question_type: edge_case

  - question: "What is the average interest rate for auto loans funded this year?"
    ground_truth_sql: |
      SELECT ROUND(AVG(rate) * 100, 3) AS avg_rate_pct
      FROM fct_loan_originations
      WHERE product_type = 'auto'
        AND funded_at >= DATE_TRUNC('year', CURRENT_DATE)
    expected_tables: [fct_loan_originations]
    expected_keywords: [AVG, rate, product_type, funded_at]
    question_type: edge_case
