- question: What is the loan mix by product type this month?
  ground_truth_sql: |
    SELECT
        product_type,
        SUM(loan_count)                                               AS loan_count,
        ROUND(SUM(total_balance), 2)                                  AS total_balance,
        ROUND(
            SUM(total_balance * weighted_avg_rate)
            / NULLIF(SUM(total_balance), 0),
            4
        )                                                             AS weighted_avg_rate
    FROM fct_loans_monthly
    WHERE as_of_month = (SELECT MAX(as_of_month) FROM fct_loans_monthly)
    GROUP BY product_type
    ORDER BY total_balance DESC
