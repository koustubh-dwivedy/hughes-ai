  - snapshot_date
  question_type: delinquency_rate
- question: How has the 90+ DPD rate trended over the last year?
  ground_truth_sql: "SELECT\n  snapshot_date,\n  ROUND(\n    SUM(CASE WHEN days_past_due\
    \ >= 90 THEN 1 ELSE 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0) * 100,\n    2\n\
    \  ) AS severe_delinquency_rate_pct\nFROM fct_loan_performance\nWHERE snapshot_date\
    \ >= CURRENT_DATE - INTERVAL '12 months'\n  AND loan_status IN ('current', 'delinquent')\n\
    GROUP BY snapshot_date\nORDER BY snapshot_date\n"
  expected_tables:
  - fct_loan_performance
  expected_keywords:
  - days_past_due
  - snapshot_date
  - GROUP BY
  - ROUND
  question_type: delinquency_rate
