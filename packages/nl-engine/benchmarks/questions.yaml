# ── Delinquency (3) ─────────────────────────────────────────────────────────

- id: must-pass-014
  category: portfolio
  source: curated-must-pass
  must_pass: true
  question: "What's our delinquency rate by product type as of the latest month?"
  question_type: delinquency_rate
  expected_metric: delinquency_rate
  expected_dimensions: [product_type]
  expected_tables: [fct_loan_performance, dim_loan]
  expected_keywords: [SUM, FILTER, is_delinquent, product_type, GROUP BY]
  ground_truth_sql: |
    SELECT l.product_type,
      ROUND((SUM(p.balance) FILTER (WHERE p.is_delinquent))::numeric
            / NULLIF(SUM(p.balance), 0)::numeric, 4) AS delinquency_rate
    FROM fct_loan_performance p
    JOIN dim_loan l USING (loan_id)
    WHERE p.snapshot_date = '2026-04-01'
    GROUP BY l.product_type
    ORDER BY l.product_type
  ground_truth_rows:
    - {product_type: "auto_direct",    delinquency_rate: 0.0835}
    - {product_type: "auto_indirect",  delinquency_rate: 0.0409}
    - {product_type: "closed_end_2nd", delinquency_rate: 0.0560}
    - {product_type: "first_mortgage", delinquency_rate: 0.1069}
    - {product_type: "heloc",          delinquency_rate: 0.0973}

