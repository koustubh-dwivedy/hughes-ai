# ─────────────────────────────────────────────────────────────────────────────
# HUG-187 — Curated must-pass set (24 questions)
#
# These are the questions whose failures embarrass us in front of a CFO. They
# ARE the gating signal for the agent path's accuracy. HUG-188's grader scores
# them via row-set match against `ground_truth_rows`.
#
# All ground_truth_rows below were captured by running the SQL against the
# `small_cu` seed (deterministic, seed=42) on 2026-05-05. Latest as_of_month
# in the seed is 2026-04-01 — used as the literal anchor in all SQL to avoid
# CURRENT_DATE drift across seed regens.
#
# Every entry must satisfy `tests/integration/test_must_pass_ground_truth.py`:
#   1. id / source / expected_metric populated.
#   2. ground_truth_sql executes against the seeded DB.
#   3. ground_truth_rows matches the SQL result via rowset_match (1% tol on floats).
#
# The single ambiguous question keeps ground_truth_sql + ground_truth_rows null;
# it tests the agent's clarification path, not its row-set accuracy.
# ─────────────────────────────────────────────────────────────────────────────

