- question: What is our current delinquency rate?
  ground_truth_sql: "SELECT\n  ROUND(\n    SUM(CASE WHEN is_delinquent THEN 1 ELSE\
    \ 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0) * 100,\n    2\n  ) AS delinquency_rate_pct\n\
    FROM fct_loan_performance\nWHERE snapshot_date = (SELECT MAX(snapshot_date) FROM\
    \ fct_loan_performance)\n  AND loan_status IN ('current', 'delinquent')\n"
  expected_tables:
  - fct_loan_performance
  expected_keywords:
  - is_delinquent
  - delinquency_rate_pct
  - snapshot_date
  - loan_status IN
  question_type: delinquency_rate
- question: How many loans are 30+ days past due right now?
  ground_truth_sql: "SELECT\n  COUNT(*) AS delinquent_loans,\n  ROUND(SUM(balance),\
    \ 2) AS delinquent_balance\nFROM fct_loan_performance\nWHERE snapshot_date = (SELECT\
    \ MAX(snapshot_date) FROM fct_loan_performance)\n  AND days_past_due >= 30\n"
  expected_tables:
  - fct_loan_performance
  expected_keywords:
  - COUNT
  - days_past_due
  - snapshot_date
  - SUM
  question_type: delinquency_rate
- question: Show the delinquency rate trend over the last 6 months
  ground_truth_sql: "SELECT\n  snapshot_date,\n  ROUND(\n    SUM(CASE WHEN is_delinquent\
    \ THEN 1 ELSE 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0) * 100,\n    2\n  ) AS\
    \ delinquency_rate_pct\nFROM fct_loan_performance\nWHERE snapshot_date >= CURRENT_DATE\
    \ - INTERVAL '6 months'\n  AND loan_status IN ('current', 'delinquent')\nGROUP\
    \ BY snapshot_date\nORDER BY snapshot_date\n"
  expected_tables:
  - fct_loan_performance
  expected_keywords:
  - is_delinquent
  - delinquency_rate_pct
  - snapshot_date
  - GROUP BY
  question_type: delinquency_rate
- question: What is the delinquency rate by product type?
  ground_truth_sql: "SELECT\n  o.product_type,\n  ROUND(\n    SUM(CASE WHEN p.is_delinquent\
    \ THEN 1 ELSE 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0) * 100,\n    2\n  ) AS\
    \ delinquency_rate_pct\nFROM fct_loan_performance p\nJOIN fct_loan_originations\
    \ o USING (loan_id)\nWHERE p.snapshot_date = (SELECT MAX(snapshot_date) FROM fct_loan_performance)\n\
    \  AND p.loan_status IN ('current', 'delinquent')\nGROUP BY o.product_type\nORDER\
    \ BY delinquency_rate_pct DESC\n"
  expected_tables:
  - fct_loan_performance
  - dim_loan
  expected_keywords:
  - is_delinquent
  - product_type
  - GROUP BY
  - JOIN
  - snapshot_date
  question_type: delinquency_rate
- question: Which branches have the highest delinquency rate?
  ground_truth_sql: "SELECT\n  o.branch_name,\n  o.branch_region,\n  ROUND(\n    SUM(CASE\
    \ WHEN p.is_delinquent THEN 1 ELSE 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0)\
    \ * 100,\n    2\n  ) AS delinquency_rate_pct,\n  COUNT(*) AS active_loans\nFROM\
    \ fct_loan_performance p\nJOIN fct_loan_originations o USING (loan_id)\nWHERE\
    \ p.snapshot_date = (SELECT MAX(snapshot_date) FROM fct_loan_performance)\n  AND\
    \ p.loan_status IN ('current', 'delinquent')\nGROUP BY o.branch_name, o.branch_region\n\
    ORDER BY delinquency_rate_pct DESC\nLIMIT 5\n"
  expected_tables:
  - fct_loan_performance
  - dim_loan
  expected_keywords:
  - is_delinquent
  - branch_name
  - GROUP BY
  - JOIN
  - snapshot_date
  question_type: delinquency_rate
- question: How many loans are 90+ days past due?
  ground_truth_sql: "SELECT\n  COUNT(*) AS severely_delinquent_loans,\n  ROUND(SUM(balance),\
    \ 2) AS delinquent_balance\nFROM fct_loan_performance\nWHERE snapshot_date = (SELECT\
    \ MAX(snapshot_date) FROM fct_loan_performance)\n  AND days_past_due >= 90\n"
  expected_tables:
  - fct_loan_performance
  expected_keywords:
  - COUNT
  - days_past_due
  - snapshot_date
  - SUM
  question_type: delinquency_rate
- question: What is the delinquency rate by DPD bucket at the latest snapshot?
  ground_truth_sql: "SELECT\n  delinquency_bucket,\n  COUNT(*) AS loan_count,\n  ROUND(SUM(balance),\
    \ 2) AS total_balance\nFROM fct_loan_performance\nWHERE snapshot_date = (SELECT\
    \ MAX(snapshot_date) FROM fct_loan_performance)\n  AND delinquency_bucket IS NOT\
    \ NULL\nGROUP BY delinquency_bucket\nORDER BY delinquency_bucket\n"
  expected_tables:
  - fct_loan_performance
  expected_keywords:
  - delinquency_bucket
  - COUNT
  - SUM
  - snapshot_date
  - GROUP BY
  question_type: delinquency_rate
- question: Show delinquency breakdown by region
  ground_truth_sql: "SELECT\n  o.branch_region,\n  ROUND(\n    SUM(CASE WHEN p.is_delinquent\
    \ THEN 1 ELSE 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0) * 100,\n    2\n  ) AS\
    \ delinquency_rate_pct,\n  COUNT(*) AS active_loans\nFROM fct_loan_performance\
    \ p\nJOIN fct_loan_originations o USING (loan_id)\nWHERE p.snapshot_date = (SELECT\
    \ MAX(snapshot_date) FROM fct_loan_performance)\n  AND p.loan_status IN ('current',\
    \ 'delinquent')\nGROUP BY o.branch_region\nORDER BY delinquency_rate_pct DESC\n"
  expected_tables:
  - fct_loan_performance
  - dim_loan
  expected_keywords:
  - is_delinquent
  - branch_region
  - GROUP BY
  - JOIN
  question_type: delinquency_rate
- question: What percentage of auto loans are delinquent?
  ground_truth_sql: "SELECT\n  ROUND(\n    SUM(CASE WHEN p.is_delinquent THEN 1 ELSE\
    \ 0 END)::NUMERIC\n    / NULLIF(COUNT(*), 0) * 100,\n    2\n  ) AS delinquency_rate_pct\n\
    FROM fct_loan_performance p\nJOIN fct_loan_originations o USING (loan_id)\nWHERE\
    \ p.snapshot_date = (SELECT MAX(snapshot_date) FROM fct_loan_performance)\n  AND\
