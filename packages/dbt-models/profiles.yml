hughes_ai:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'cubidev') }}"
      password: "{{ env_var('DBT_PASSWORD', 'localdev') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'cubi') }}"
      schema: public
      threads: 4
