version: 2

# Catalog overhaul (2026-05-10b): every metric is named and described to be
# self-disambiguating — no synonym table required. Sibling metrics call out
# explicitly how they differ ("distinct from <other>").
# Categories used:
#   simple — sum/count/avg of a measure
#   ratio  — numerator measure / denominator measure

metrics:
  # ---------------- Origence application + funding pipeline ----------------
  - name: application_count
    description: |
      Count of loan applications submitted in the period (one row per
      submission, regardless of approval or funding outcome). NOT loans
      funded — for that use `funded_count`.
    label: Application Count
    type: simple
    type_params:
      measure: application_count

  - name: requested_amount_total
    description: |
      Sum of dollar amounts requested across submitted applications
      (pre-decision). Distinct from `funded_amount_total`, which is
      post-funding.
    label: Requested Amount Total
    type: simple
    type_params:
      measure: requested_amount_total

  - name: funded_count
    description: |
      Number of loans funded in the period (CU parlance: "originations").
      Distinct from `application_count` (submissions) and `loan_count`
      (portfolio outstanding).
    label: Funded Count
    type: simple
    type_params:
      measure: funded_count

  - name: funded_amount_total
    description: |
      Total dollar value of loans funded in the period. Distinct from
      `requested_amount_total` (pre-decision) and `total_loan_balance`
      (snapshot).
    label: Funded Amount Total
    type: simple
    type_params:
      measure: funded_amount_total

  - name: avg_loan_amount
    description: |
      Mean funded loan amount in the period (sum of funded dollars / count
      of fundings). Per-origination, NOT a portfolio average — for that
      use `avg_loan_balance`.
    label: Average Loan Amount
    type: ratio
    type_params:
      numerator: funded_amount_total
      denominator: funded_count

  - name: approval_rate
    description: |
      Funded count divided by application count over the same period.
      Approval-rate proxy in synthetic data.
    label: Approval Rate
    type: ratio
    type_params:
      numerator: funded_count
      denominator: application_count

  # ---------------- Loan portfolio (period-end snapshots) ----------------
  - name: total_loan_balance
    description: |
      Sum of outstanding loan balances at period end (monthly snapshot).
      DOLLARS, not a count. For portfolio loan COUNT use `loan_count`.
    label: Total Loan Balance
    type: simple
    type_params:
      measure: total_loan_balance

  - name: loan_count
    description: |
      Distinct count of loans in the portfolio at period end. NOT
      origination volume — for fundings in the period use `funded_count`.
    label: Loan Count
    type: simple
    type_params:
      measure: loan_count

  - name: avg_loan_balance
    description: |
      Average outstanding balance across loans in the portfolio at period
      end. Distinct from `avg_loan_amount` (funding-time mean).
    label: Average Loan Balance
    type: simple
    type_params:
      measure: avg_loan_balance

  - name: weighted_avg_loan_rate
    description: |
      Balance-weighted average interest rate across the loan portfolio at
      period end. Sourced from the pre-computed executive KPI mart
      (proper portfolio-weighted methodology; the loans_monthly grain's
      own `weighted_avg_loan_rate` measure is an avg-of-weighted-avg
      and is NOT exposed as a metric).
    label: Weighted Avg Loan Rate
    type: simple
    type_params:
      measure: weighted_avg_loan_rate_kpi

  - name: borrower_loan_balance
    description: |
      Per-loan outstanding balance at the snapshot date — grain is
      loan x snapshot. Use with `order` and `limit` for top-N borrower
      listings. NOT pre-aggregated.
    label: Borrower Loan Balance
    type: simple
    type_params:
      measure: loan_balance_snapshot

  - name: single_loan_customers
    description: |
      Count of customers (members) holding exactly one loan at period
      end.
    label: Single Loan Customers
    type: simple
    type_params:
      measure: single_loan_customer_count

  - name: dealer_concentration_balance
    description: |
      Loan balance attributable to a dealer at period end. For a true
      concentration percentage, divide by `total_loan_balance` over the
      same window without a dealer filter.
    label: Dealer Concentration Balance
    type: simple
    type_params:
      measure: total_loan_balance

  # ---------------- Deposit portfolio ----------------
  - name: total_deposit_balance
    description: |
      Sum of outstanding deposit balances at period end across all
      products and branches. Group by `deposit_product` or `branch` for
      breakdowns.
    label: Total Deposit Balance
    type: simple
    type_params:
      measure: total_deposit_balance

  - name: avg_deposit_balance
    description: |
      Average deposit account balance at period end.
    label: Average Deposit Balance
    type: simple
    type_params:
      measure: avg_deposit_balance

  - name: deposit_account_balance
    description: |
      Per-account deposit balance at period end. Use with `order` and
      `limit` for top-N depositor listings; group by `branch` or
      `deposit_product` as needed.
    label: Deposit Account Balance
    type: simple
    type_params:
      measure: total_deposit_balance

  - name: mtd_deposit_change
    description: |
      Month-to-date change in total deposit balance for the latest month.
    label: MTD Deposit Change
    type: simple
    type_params:
      measure: deposit_mtd_change

  - name: ytd_deposit_change
    description: |
      Year-to-date change in total deposit balance for the latest fiscal
      year.
    label: YTD Deposit Change
    type: simple
    type_params:
      measure: deposit_ytd_change

  - name: monthly_loan_growth
    description: |
      Month-over-month dollar change in total loan balance (from the
      executive KPI mart).
    label: Monthly Loan Growth
    type: simple
    type_params:
      measure: monthly_loan_growth

  - name: monthly_deposit_growth
    description: |
      Month-over-month dollar change in total deposit balance (from the
      executive KPI mart).
    label: Monthly Deposit Growth
    type: simple
    type_params:
      measure: monthly_deposit_growth

  # ---------------- Delinquency / risk ----------------
  - name: delinquent_balance
    description: |
      Outstanding balance on delinquent loans (any DPD bucket — 15-29,
      30-59, 60-89, or 90+). For just 90+ DPD use `nonaccrual_balance`.
      Group by `bucket` for an aging distribution.
    label: Delinquent Balance
    type: simple
    type_params:
      measure: delinquent_balance

  - name: delinquency_rate
    description: |
      Delinquent balance divided by total loan balance. Sliceable by
      `product_type`, `branch`, and `officer`.
    label: Delinquency Rate
    type: ratio
    type_params:
      numerator: delinquent_balance
      denominator: total_loan_balance

  - name: past_due_loan_count
    description: |
      Count of loans 30+ DPD at period end (excludes 1-14 DPD which is
      grace-period).
    label: Past Due Loan Count
    type: simple
    type_params:
      measure: past_due_loan_count

  - name: past_due_ratio
    description: |
      Pre-computed blended past-due dollar ratio from the executive KPI
      mart. One row per month.
    label: Past Due Ratio
    type: simple
    type_params:
      measure: blended_past_due_ratio

  - name: nonaccrual_balance
    description: |
      Outstanding balance on loans 90+ DPD (regulatory non-accrual
      definition). STRICTER than `delinquent_balance` (which includes
      15-29 / 30-59 / 60-89 buckets too).
    label: Nonaccrual Balance
    type: simple
    type_params:
      measure: nonaccrual_balance

  # ---------------- Lifecycle ----------------
  - name: lifecycle_event_count
    description: |
      Count of loan lifecycle events (`new`, `paid_off`) per month.
      Group by `event_type` for the breakdown. The lifecycle mart does
      NOT currently emit `renewed` events.
    label: Lifecycle Event Count
    type: simple
    type_params:
      measure: lifecycle_event_count

  # ---------------- Cross-portfolio ratios (executive KPI source) ----------------
  - name: loan_to_deposit_ratio
    description: |
      Total loans / total deposits, pre-computed monthly executive KPI.
    label: Loan-to-Deposit Ratio
    type: simple
    type_params:
      measure: loan_to_deposit_ratio

  - name: core_deposit_ratio
    description: |
      Core deposits / total deposits, pre-computed monthly executive KPI.
    label: Core Deposit Ratio
    type: simple
    type_params:
      measure: core_deposit_ratio

  - name: rate_spread
    description: |
      Weighted-average loan rate minus weighted-average deposit rate,
      pre-computed monthly.
    label: Rate Spread
    type: simple
    type_params:
      measure: rate_spread

  # ---------------- NCUA + CECL ----------------
  - name: ncua_total_loans
    description: |
      NCUA 5300 line 386 — total loans outstanding at period end. Group
      by `ncua_5300_line_code` for the call-report breakdown.
      Numerically identical to `total_loan_balance`; surfaced separately
      for regulatory naming.
    label: NCUA Total Loans
    type: simple
    type_params:
      measure: total_loan_balance

  - name: cecl_allowance_balance
    description: |
      CECL allowance ending balance per month and segment.
    label: CECL Allowance Balance
    type: simple
    type_params:
      measure: cecl_ending_balance

  - name: cecl_provision_ytd
    description: |
      Year-to-date CECL provision expense per month and segment.
    label: CECL Provision YTD
    type: simple
    type_params:
      measure: cecl_provision_expense
