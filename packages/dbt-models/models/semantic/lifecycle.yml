version: 2

semantic_models:
  - name: loan_lifecycle_events
    description: Loan lifecycle events (new / active / renewed / paid_off) by month.
    model: ref('fct_loan_lifecycle_events')
    defaults:
      agg_time_dimension: event_month
    entities:
      - name: event
        type: primary
        expr: row_id
    dimensions:
      - name: event_month
        type: time
        expr: as_of_month
        type_params:
          time_granularity: month
      - name: event_type
        type: categorical
      - name: product_type
        type: categorical
    measures:
      - name: lifecycle_event_count
        agg: sum
        expr: loan_count
      - name: lifecycle_event_amount
        agg: sum
        expr: total_amount
