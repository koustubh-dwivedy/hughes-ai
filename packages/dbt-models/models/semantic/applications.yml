version: 2

semantic_models:
  - name: applications
    description: Origence loan applications (raw stg layer); application-level metrics.
    model: ref('stg_origence_applications')
    defaults:
      agg_time_dimension: applied_at
    entities:
      - name: application
        type: primary
        expr: application_id
      - name: member
        type: foreign
        expr: member_id
    dimensions:
      - name: applied_at
        type: time
        type_params:
          time_granularity: day
      - name: product_type
        type: categorical
      - name: channel
        type: categorical
      - name: status
        type: categorical
    measures:
      - name: application_count
        agg: count
        expr: application_id
      - name: requested_amount_total
        agg: sum
        expr: requested_amount

  - name: fundings
    description: Origence funding events.
    model: ref('stg_origence_fundings')
    defaults:
      agg_time_dimension: funded_at
    primary_entity: fundings_grain
    entities:
      - name: application
        type: foreign
        expr: application_id
    dimensions:
      - name: funded_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: funded_count
        agg: count
        expr: funding_id
      - name: funded_amount_total
        agg: sum
        expr: funded_amount
