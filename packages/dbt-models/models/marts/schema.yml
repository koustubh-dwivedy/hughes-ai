version: 2

models:
  - name: fct_loans_monthly
    description: Monthly grain rollup of loan portfolio by product, branch, and officer
    columns:
      - name: row_id
        data_tests: [not_null, unique]
      - name: as_of_month
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_calendar')
              field: calendar_date
      - name: product_type
        data_tests: [not_null]
      - name: branch_id
        data_tests: [not_null]
      - name: loan_count
        data_tests: [not_null]
      - name: total_balance
        data_tests: [not_null]
      - name: avg_balance
        data_tests: [not_null]
      - name: weighted_avg_rate
        data_tests: [not_null]
      - name: single_loan_customer_count
        data_tests: [not_null]

  - name: fct_deposits_monthly
    description: Monthly grain rollup of deposit portfolio by product and branch
    columns:
      - name: row_id
        data_tests: [not_null, unique]
      - name: as_of_month
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_calendar')
              field: calendar_date
      - name: deposit_product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_deposit_product')
              field: deposit_product_id
      - name: branch_id
        data_tests: [not_null]
      - name: account_count
        data_tests: [not_null]
      - name: total_balance
        data_tests: [not_null]
      - name: avg_balance_per_customer
        data_tests: [not_null]
      - name: opened_count
        data_tests: [not_null]
      - name: closed_count
        data_tests: [not_null]
      - name: mtd_change
        data_tests: [not_null]
      - name: ytd_change
        data_tests: [not_null]
      - name: is_core_deposit
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fct_delinquency_monthly
    description: Monthly delinquency rollup by officer, branch, and DPD bucket for Dashboard 2
    columns:
      - name: row_id
        data_tests: [not_null, unique]
      - name: as_of_month
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_calendar')
              field: calendar_date
      - name: officer_id
        data_tests:
          - relationships:
              to: ref('dim_officer')
              field: officer_id
      - name: branch_id
        data_tests: [not_null]
      - name: bucket
        data_tests:
          - not_null
          - accepted_values:
              values: ['15-29', '30-59', '60-89', '90+']
      - name: loan_count
        data_tests: [not_null]
      - name: balance
        data_tests: [not_null]
      - name: past_due_loan_count
        data_tests: [not_null]
      - name: is_in_13_month_window
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fct_loan_lifecycle_events
    description: Monthly loan lifecycle events (new / paid_off) by product type for Dashboard 3
    columns:
      - name: row_id
        data_tests: [not_null, unique]
      - name: as_of_month
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_calendar')
              field: calendar_date
      - name: product_type
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['new', 'renewed', 'paid_off']
      - name: loan_count
        data_tests: [not_null]
      - name: total_amount
        data_tests: [not_null]
