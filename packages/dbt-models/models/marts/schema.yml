version: 2

models:
  - name: fct_loans_monthly
    description: Monthly grain rollup of loan portfolio by product, branch, and officer
    columns:
      - name: row_id
        data_tests: [not_null, unique]
      - name: as_of_month
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_calendar')
              field: calendar_date
      - name: product_type
        data_tests: [not_null]
      - name: branch_id
        data_tests: [not_null]
      - name: loan_count
        data_tests: [not_null]
      - name: total_balance
        data_tests: [not_null]
      - name: avg_balance
        data_tests: [not_null]
      - name: weighted_avg_rate
        data_tests: [not_null]
      - name: single_loan_customer_count
        data_tests: [not_null]
