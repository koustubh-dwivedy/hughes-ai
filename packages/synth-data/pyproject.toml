[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "pydantic>=2",
    "structlog>=24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synth_data"]
