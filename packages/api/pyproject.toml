[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0.0",
    "prometheus-client>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "nl-engine",
    "sse-starlette>=2.1.0",
]

[tool.uv.sources]
nl-engine = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
