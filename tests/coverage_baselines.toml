# Per-package coverage floors (HUG-234).
#
# `scripts/check_coverage.py` fails CI if any package's measured
# line-coverage % drops more than `tolerance_pp` percentage points
# below its baseline. A PR can raise a baseline via normal review;
# silently lowering is rejected.
#
# IMPORTANT: the `api` baseline measures coverage from the `-m "not db"`
# slice only (unit-test job). DB-backed tests run in integration-test
# and their line coverage is NOT counted today (artifact-merge across
# jobs is a future enhancement). So the api number naturally trends
# downward as DB-heavy modules grow — adjust the baseline when the
# DB-test-only modules add meaningful lines.
#
# History:
# - 2026-05-15 initial: api=70 nl-engine=78 frontend=84.
# - 2026-05-15 HUG-217: api 70→67 (new worker.py + executor.py +
#   research routes are DB-tested; their no-DB coverage is naturally
#   low). Floor moves with baseline so the 2pp tolerance still
#   absorbs noise.
# - 2026-05-15 HUG-221: api 67→63 (synthesizer + lead_memory +
#   replanner add more DB-only modules; same dynamic). Future
#   enhancement: merge integration-test coverage data into the gate.
# - 2026-05-16 HUG-241/242/243: nl-engine 78→75. New modules
#   `repo/lead_memory.py`, `repo/plans.py`, `repo/subagent_calls.py`,
#   `agent/plan_tool.py`, `agent/subagent_tool.py` are exercised by
#   `pytest.mark.db` tests that run in the integration job; their
#   line coverage isn't visible to the unit-job gate. The new
#   `test_lead_agent_units.py` covers the pure-Python paths but the
#   psycopg-bound bodies inevitably show as uncovered here. Floor
#   slides to 73% via the 2pp tolerance.

[thresholds]
tolerance_pp = 2

[baselines]
api = 63
nl-engine = 75
frontend = 84
