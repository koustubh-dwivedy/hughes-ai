# Per-package coverage floors (HUG-234).
#
# `scripts/check_coverage.py` fails CI if any package's measured
# line-coverage % drops more than `tolerance_pp` percentage points
# below its baseline. A PR can raise a baseline via normal review;
# silently lowering is rejected.
#
# Initial values are the measured percentages on 2026-05-15 (after
# Phase B of the autonomous-execution session). Refresh whenever a
# new test suite or major code addition shifts the steady-state.

[thresholds]
tolerance_pp = 2

[baselines]
api = 70
nl-engine = 78
frontend = 84
