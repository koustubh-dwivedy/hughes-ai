services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cubidev
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: cubi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
