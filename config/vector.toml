# Vector configuration — dev observability fan-out for Hughes AI
# Sources: container logs
# Sinks: VictoriaLogs (logs)
# Note: traces go directly app → Jaeger OTLP HTTP (port 4318), bypassing Vector

[api]
enabled = true
address = "0.0.0.0:8686"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

[sources.docker_logs]
type = "docker_logs"
exclude_containers = ["vector"]

# ---------------------------------------------------------------------------
# Transforms
# ---------------------------------------------------------------------------

[transforms.parse_logs]
type = "remap"
inputs = ["docker_logs"]
source = '''
.timestamp = to_string!(.timestamp)
'''

# ---------------------------------------------------------------------------
# Sinks
# ---------------------------------------------------------------------------

[sinks.victoria_logs]
type = "loki"
inputs = ["parse_logs"]
endpoint = "http://victorialogs:9428/insert"
encoding.codec = "json"

[sinks.victoria_logs.labels]
container = "{{ container_name }}"
