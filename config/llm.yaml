# LLM configuration for Surface 2 (the LangGraph agent).
#
# To change which LLM the agent uses: edit this file and ensure the
# `api_key_env` variable is set in your `.env` (or shell env). No code
# changes required.
#
# This is the SINGLE source of truth for LLM selection. There is no
# fallback chain (HUG-190, 2026-05-06). One provider, one model, one
# predictable code path. If the provider experiences an outage, ops
# swaps the file rather than relying on hidden multi-provider mixing.
#
# Schema:
#   provider:     groq | google | ollama
#   model:        provider-specific identifier
#   api_key_env:  env var holding the API key
#   base_url_env: optional; env var holding a base URL override
#                 (defaults to the provider's default endpoint)

provider: ollama
model: glm-5.1
api_key_env: OLLAMA_API_KEY
base_url_env: OLLAMA_BASE_URL
