# LLM configuration for Surface 2 (the LangGraph agent).
#
# Single source of truth for LLM selection. There is no fallback chain
# (HUG-190, 2026-05-06) — one provider, one model, one predictable code
# path. To change which LLM the agent uses: edit this file and ensure
# the api_key_env variable is set in `.env` (or shell env). No code
# changes required.
#
# Schema:
#   provider:     groq | google | ollama | openai_compatible
#   model:        provider-specific identifier
#   api_key_env:  env var holding the API key (kept out of source)
#   base_url_env: optional; env var holding a base URL override
#
# Provider notes:
#   - groq:              GROQ_API_KEY.   Default qwen/qwen3-32b.
#   - google:            GOOGLE_API_KEY. Default gemma-4-31b-it.
#   - ollama:            OLLAMA_API_KEY. Ollama Cloud or self-hosted
#                        via OLLAMA_BASE_URL.
#   - openai_compatible (HUG-206): generic provider for any endpoint
#                        speaking the OpenAI HTTP wire protocol —
#                        Cerebras, Together, Fireworks, Anyscale,
#                        vLLM, OpenAI itself. Adding a new such
#                        endpoint is a config change, not a code
#                        change.

provider: ollama
model: glm-5.2
api_key_env: OLLAMA_API_KEY
base_url_env: OLLAMA_BASE_URL

# OPTIONAL: per-role overrides for the deep-research feature (HUG-204).
# When present, `make_llm(role="lead"|"worker"|"verifier")` picks the
# named entry; missing roles fall back to `roles.lead` (if defined)
# and then to the top-level config above. `make_llm()` with no role
# always uses the top-level config — ADR-0004's single-LLM rule still
# defaults unless this block opts in.
#
# Example (commented; uncomment + edit to opt in):
#
# roles:
#   lead:
#     provider: ollama
#     model: glm-5.1
#     api_key_env: OLLAMA_API_KEY
#   worker:
#     provider: groq
#     model: qwen/qwen3-32b
#     api_key_env: GROQ_API_KEY
#   verifier:
#     provider: google
#     model: gemma-4-31b-it
#     api_key_env: GOOGLE_API_KEY
