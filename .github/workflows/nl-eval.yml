name: NL Eval

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/nl-engine/**'
      - 'scripts/eval.py'
      - 'scripts/run-nl-eval.sh'

jobs:
  nl-eval:
    name: NL Accuracy Benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - name: Apply schema migrations
        run: |
          psql $DATABASE_URL -f migrations/001_lending_schema.sql
          psql $DATABASE_URL -f migrations/002_query_history.sql
      - name: Seed database
        run: uv run python scripts/seed.py --profile small_cu
      - name: Build dbt models
        run: cd packages/dbt-models && uv run dbt build --profiles-dir .
      - name: Run NL eval
        run: uv run python scripts/eval.py --fail-under 85
