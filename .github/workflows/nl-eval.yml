name: NL Eval

on:
  workflow_dispatch:
  push:
    paths:
      - 'migrations/**'
      - 'packages/nl-engine/**'
      - 'packages/dbt-models/**'
      - 'packages/synth-data/**'
      - 'scripts/eval.py'
      - 'scripts/eval_grader.py'
      - 'scripts/run-nl-eval.sh'
      - '.github/workflows/nl-eval.yml'

# Successive pushes on the same branch cancel any in-flight eval — a
# 30-min benchmark stacked behind another 30-min benchmark is wasted
# Groq quota.
concurrency:
  group: nl-eval-${{ github.ref }}
  cancel-in-progress: true

# Needed by the "Commit promotion ledger" step on main-branch pushes
# (HUG-189). PR-CI runs from forks won't be able to push; the conditional
# below also keeps fork PRs from attempting the commit step.
permissions:
  contents: write

jobs:
  nl-eval:
    name: NL Accuracy Benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image so migration 001's `CREATE EXTENSION vector`
        # actually installs (matches ci.yml — see HUG-184).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + push-back token for the ledger commit step.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - name: Apply schema migrations
        run: |
          for f in migrations/*.sql; do
            echo "→ $f"
            psql $DATABASE_URL -f "$f"
          done
      - name: Seed database
        run: uv run python scripts/seed.py --profile small_cu
      - name: Build dbt models
        run: cd packages/dbt-models && uv run dbt build --profiles-dir .
      - name: Run NL eval
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] \
              && [ "${{ github.event_name }}" = "push" ]; then
            uv run python scripts/eval.py --full \
              --gate must-pass=80,long-tail=65 \
              --write-ledger \
              --run-id "${{ github.run_id }}" \
              --commit-sha "${{ github.sha }}"
          else
            uv run python scripts/eval.py --full \
              --gate must-pass=80,long-tail=65
          fi
      - name: Commit promotion ledger
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/nl-engine/benchmarks/.promotion-ledger.csv
          git diff --cached --quiet || git commit -m \
            "chore(eval): append promotion ledger row from run ${{ github.run_id }} [skip ci]"
          git push origin main
