name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run ruff check .
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install
        working-directory: packages/frontend
      - run: pnpm lint
        working-directory: packages/frontend

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run mypy packages/synth-data packages/nl-engine packages/api --strict
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - run: pnpm exec tsc --noEmit
        working-directory: packages/frontend

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - run: pnpm test
        working-directory: packages/frontend

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - name: Run unit tests
        run: |
          set +e
          uv run pytest tests/ --ignore=tests/structural/ --ignore=tests/integration/ -v
          EXIT=$?
          set -e
          if [ $EXIT -eq 5 ]; then echo "No unit tests yet — skipping"; exit 0; fi
          exit $EXIT

  structural-test:
    name: Structural Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run pytest tests/structural/ -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run bandit -c pyproject.toml -r packages/
      - run: uv run semgrep --config .semgrep/ --error packages/

  frontend-storybook:
    name: Frontend Storybook / Loki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - name: Build Storybook
        run: pnpm build-storybook
        working-directory: packages/frontend
      - name: Serve Storybook + run Loki
        working-directory: packages/frontend
        run: |
          npx http-server storybook-static --port 6006 --silent &
          until curl -sf http://127.0.0.1:6006 > /dev/null; do sleep 1; done
          pnpm loki:test --requireReference

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, structural-test, security-scan, frontend-unit, frontend-storybook]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubidev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - name: Apply schema migrations
        run: |
          psql $DATABASE_URL -f migrations/001_lending_schema.sql
          psql $DATABASE_URL -f migrations/002_query_history.sql
          psql $DATABASE_URL -f migrations/003_members.sql
          psql $DATABASE_URL -f migrations/004_officers.sql
          psql $DATABASE_URL -f migrations/005_watchlist_nonaccrual.sql
          psql $DATABASE_URL -f migrations/006_deposits.sql
          psql $DATABASE_URL -f migrations/007_readonly_role.sql
          psql $DATABASE_URL -f migrations/008_loan_lifecycle_events.sql
          psql $DATABASE_URL -f migrations/009_deposit_history.sql
          psql $DATABASE_URL -f migrations/010_readonly_grants.sql
      - name: Seed synthetic data
        run: uv run python scripts/seed.py --profile small_cu
      - name: Build and test marts
        run: |
          cd packages/dbt-models
          uv run dbt build --select +marts --profiles-dir .
      - name: Run integration tests
        run: |
          set +e
          uv run pytest tests/integration/ -v
          EXIT=$?
          set -e
          if [ $EXIT -eq 4 ] || [ $EXIT -eq 5 ]; then echo "No integration tests yet — skipping"; exit 0; fi
          exit $EXIT

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubidev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install
        working-directory: packages/frontend
      - name: Apply schema migrations
        run: |
          psql $DATABASE_URL -f migrations/001_lending_schema.sql
          psql $DATABASE_URL -f migrations/002_query_history.sql
      - name: Start API server
        run: |
          uv run uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 2; done'
      - name: Install Playwright Chromium
        working-directory: packages/frontend
        run: pnpm exec playwright install chromium --with-deps
      - name: Run E2E tests
        working-directory: packages/frontend
        run: pnpm test:e2e
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: packages/frontend/test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [e2e-test, frontend-storybook]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - run: pnpm build
        working-directory: packages/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          retention-days: 7
