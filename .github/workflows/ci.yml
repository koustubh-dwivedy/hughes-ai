name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm install
        working-directory: packages/frontend
      - run: pnpm lint
        working-directory: packages/frontend

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy packages/synth-data packages/nl-engine packages/api --strict
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - run: pnpm exec tsc --noEmit
        working-directory: packages/frontend

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - run: pnpm test
        working-directory: packages/frontend

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Run unit tests (top-level)
        run: |
          set +e
          uv run pytest tests/ --ignore=tests/structural/ --ignore=tests/integration/ -m "not db" -v
          EXIT=$?
          set -e
          if [ $EXIT -eq 5 ]; then echo "No unit tests yet — skipping"; exit 0; fi
          exit $EXIT
      # Two separate invocations because both packages have a top-level
      # `tests/__init__.py` — running them in one pytest collects collides
      # at the `tests.*` module name. Tests tagged `@pytest.mark.db` run
      # in the integration-test job against live Postgres (HUG-229).
      - name: Run package unit tests (nl-engine, no DB)
        run: uv run pytest packages/nl-engine/tests/ -m "not db" -v
      - name: Run package unit tests (api, no DB)
        run: uv run pytest packages/api/tests/ -m "not db" -v

  structural-test:
    name: Structural Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/structural/ -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run bandit -c pyproject.toml -r packages/
      - run: uv run semgrep --config .semgrep/ --error packages/

  frontend-storybook:
    name: Frontend Storybook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - name: Build Storybook
        run: pnpm build-storybook
        working-directory: packages/frontend

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, structural-test, security-scan, frontend-unit, frontend-storybook]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubidev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Apply schema migrations
        run: |
          for f in migrations/*.sql; do
            echo "→ applying $f"
            psql "$DATABASE_URL" -f "$f"
          done
      - name: Seed synthetic data
        run: uv run python scripts/seed.py --profile small_cu
      - name: Build and test marts
        run: |
          cd packages/dbt-models
          uv run dbt seed --profiles-dir .
          uv run dbt build --profiles-dir .
      - name: MetricFlow validate-configs (HUG-174)
        run: |
          cd packages/dbt-models
          uv run mf validate-configs --skip-dw
      - name: Data model audit (HUG-166)
        run: |
          uv run pytest tests/audit/ -v
          uv run python scripts/audit_data_model.py
      - name: Run integration tests
        run: |
          set +e
          uv run pytest tests/integration/ -v
          EXIT=$?
          set -e
          if [ $EXIT -eq 4 ] || [ $EXIT -eq 5 ]; then echo "No integration tests yet — skipping"; exit 0; fi
          exit $EXIT
      # `-m db` matches every file with `pytestmark = pytest.mark.db`
      # (HUG-229) — supersedes the old hand-maintained file list. Two
      # invocations because of the `tests.*` module-name collision (see
      # unit-test job above).
      - name: Run package integration tests (api, DB-backed)
        run: uv run pytest packages/api/tests/ -m db -v
      - name: Run package integration tests (nl-engine, DB-backed)
        run: uv run pytest packages/nl-engine/tests/ -m db -v

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubidev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      REDIS_URL: redis://localhost:6379
      # E2E tests mock every API endpoint via Playwright `page.route(...)`.
      # The MetricFlow catalog warmup (`mf list metrics` subprocess, ~4 min
      # cold) is unnecessary here and was the cause of E2E timeouts. Local
      # NL eval still warms by default.
      API_WARM_CATALOG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm install
        working-directory: packages/frontend
      - name: Apply schema migrations
        run: |
          for f in migrations/*.sql; do
            echo "→ applying $f"
            psql "$DATABASE_URL" -f "$f"
          done
      - name: Seed synthetic data
        run: uv run python scripts/seed.py --profile small_cu
      - name: Build dbt models (generates semantic manifest for API warmup)
        run: |
          cd packages/dbt-models
          uv run dbt seed --profiles-dir .
          uv run dbt build --profiles-dir .
      - name: Start API server
        run: |
          uv run uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 2; done'
      - name: Install Playwright browsers (Chromium full + Firefox/WebKit smoke)
        working-directory: packages/frontend
        run: pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Run E2E tests
        working-directory: packages/frontend
        run: pnpm test:e2e
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: packages/frontend/test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [e2e-test, frontend-storybook]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend
      - run: pnpm build
        working-directory: packages/frontend
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: packages/frontend/dist
          retention-days: 7
