name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run ruff check .
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install
        working-directory: packages/frontend
      - run: pnpm lint
        working-directory: packages/frontend

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run mypy packages/synth-data packages/nl-engine packages/api --strict

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - name: Run unit tests
        run: |
          set +e
          uv run pytest tests/ --ignore=tests/structural/ --ignore=tests/integration/ -v
          EXIT=$?
          set -e
          if [ $EXIT -eq 5 ]; then echo "No unit tests yet — skipping"; exit 0; fi
          exit $EXIT

  structural-test:
    name: Structural Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run pytest tests/structural/ -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run bandit -c pyproject.toml -r packages/
      - run: uv run semgrep --config .semgrep/ --error packages/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, structural-test, security-scan]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cubidev
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubidev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cubidev:localdev@localhost:5432/cubi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - name: Run integration tests
        run: |
          set +e
          uv run pytest tests/integration/ -v
          EXIT=$?
          set -e
          if [ $EXIT -eq 4 ] || [ $EXIT -eq 5 ]; then echo "No integration tests yet — skipping"; exit 0; fi
          exit $EXIT

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install
        working-directory: packages/frontend
      - run: echo "Build checks passed — Docker image build added once Dockerfile exists"
