[tool.uv.workspace]
members = ["packages/synth-data", "packages/nl-engine", "packages/api"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "semgrep",
    "pre-commit",
    "pytest",
    "types-PyYAML",
    "dbt-postgres>=1.8.0",
    "dbt-metricflow>=0.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "T20", "S", "C90"]
# T20 = flake8-print: bans print() — use structlog.get_logger() instead

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S608"]
"packages/*/tests/**/*.py" = ["S101"]
"scripts/audit_data_model.py" = ["T201"]
"scripts/backfill_thread_titles.py" = ["T201"]
"scripts/compile_prompts.py" = ["T201"]
# Prompt files contain natural-language examples (JSON, narrative). The
# line-length rule fights readability here — the LLM reads the prompt
# verbatim, so artificial wrapping changes the model's input.
"packages/*/src/**/lead_system_prompt.py" = ["E501"]
"packages/*/src/**/system_prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/synth-data/src:packages/nl-engine/src:packages/api/src"
exclude = ["packages/.*/tests/", "packages/nl-engine/src/nl_engine/agent/prompts/"]

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true

[tool.bandit]
targets = ["packages"]
exclude_dirs = [".venv", "packages/nl-engine/tests", "packages/api/tests", "node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
