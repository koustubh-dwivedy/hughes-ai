[tool.uv.workspace]
members = ["packages/synth-data", "packages/nl-engine", "packages/api"]

[dependency-groups]
dev = ["ruff", "mypy", "bandit", "semgrep", "pre-commit", "pytest", "types-PyYAML", "dbt-postgres>=1.8.0"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "T20", "S", "C90"]
# T20 = flake8-print: bans print() — use structlog.get_logger() instead

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]           # assert is idiomatic in pytest
"packages/*/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.bandit]
targets = ["packages"]
exclude_dirs = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
