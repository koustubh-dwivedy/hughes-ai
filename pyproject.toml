[tool.uv.workspace]
members = ["packages/synth-data", "packages/nl-engine", "packages/api"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "semgrep",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "dbt-postgres>=1.8.0",
    "dbt-metricflow==0.12.0",
]
# HUG-251: deps the API needs at runtime but linters/tests don't.
# The MetricFlow warmup in api.main:lifespan invokes the `mf` CLI via
# subprocess (nl_engine.repo.metricflow), which dbt-metricflow installs.
# Pulled in by the Dockerfile via `uv sync --no-dev --group runtime-extras`.
runtime-extras = [
    "dbt-postgres>=1.8.0",
    "dbt-metricflow==0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "T20", "S", "C90"]
# T20 = flake8-print: bans print() — use structlog.get_logger() instead

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S608"]
"packages/*/tests/**/*.py" = ["S101"]
# HUG-257: infra/tests connect to prod Cloud SQL via gcloud secrets +
# subprocess. Calling gcloud by short name and asserting on results are
# both intentional patterns there.
"infra/tests/**/*.py" = ["S101", "S603", "S607"]
"scripts/audit_data_model.py" = ["T201"]
"scripts/backfill_thread_titles.py" = ["T201"]
"scripts/compile_prompts.py" = ["T201"]
"scripts/check_coverage.py" = ["T201", "S314"]
"scripts/generate_type_schemas.py" = ["T201"]
"scripts/build_metric_catalog.py" = ["T201"]
# Prompt files contain natural-language examples (JSON, narrative). The
# line-length rule fights readability here — the LLM reads the prompt
# verbatim, so artificial wrapping changes the model's input.
"packages/*/src/**/lead_system_prompt.py" = ["E501"]
"packages/*/src/**/lead_agent_prompt.py" = ["E501"]
"packages/*/src/**/system_prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/synth-data/src:packages/nl-engine/src:packages/api/src"
exclude = ["packages/.*/tests/", "packages/nl-engine/src/nl_engine/agent/prompts/"]

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true

[tool.bandit]
targets = ["packages"]
exclude_dirs = [".venv", "packages/nl-engine/tests", "packages/api/tests", "node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live Postgres connection (DATABASE_URL env var set + reachable). Runs in CI's integration-test job, NOT unit-test.",
]
